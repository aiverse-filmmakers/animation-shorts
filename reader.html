<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>AI Animation Shorts | Reader</title>
<meta name="description" content="Read AI Animation Shorts brains, guides and research inside the website.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fff;--surface:#f6f6f4;--surface2:#efefeb;--ink:#171817;--muted:#6c6f69;--line:#dedfd9;--accent:#146b4b;--accent-soft:#e6f2eb;color-scheme:light}
html[data-theme="dark"]{--bg:#000;--surface:#111;--surface2:#1a1a18;--ink:#f5f5f0;--muted:#a5a79f;--line:#34352f;--accent:#72d4a8;--accent-soft:#123c2d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}button,a{font:inherit}.bar{height:70px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,60px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}.brand{color:var(--ink);text-decoration:none;font-weight:760;letter-spacing:-.035em}.brand small{display:block;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}.top{display:flex;gap:8px;align-items:center}.button,.theme{min-height:42px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:0 15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.theme{width:46px;padding:0}.shell{max-width:1160px;margin:auto;padding:clamp(34px,5vw,72px) clamp(18px,5vw,72px)}.hero{display:grid;gap:15px;padding-bottom:30px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(38px,5.5vw,68px);line-height:1;letter-spacing:-.06em;margin:0;max-width:900px}.subtitle{font-size:18px;color:var(--muted);margin:0;max-width:760px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px}.reader{max-width:860px;padding:34px 0 90px}.reader h1{font-size:42px;margin:0 0 26px}.reader h2{font-size:29px;line-height:1.15;letter-spacing:-.04em;margin:42px 0 14px}.reader h3{font-size:20px;line-height:1.2;letter-spacing:-.025em;margin:28px 0 10px}.reader p{margin:10px 0}.reader ul,.reader ol{padding-left:24px}.reader li{margin:6px 0}.reader blockquote{margin:20px 0;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}.reader code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);padding:2px 5px;border-radius:5px;overflow-wrap:anywhere}.code{position:relative;margin:18px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}.code pre{margin:0;padding:50px 18px 20px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.copycode{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}.reader a{color:var(--accent);font-weight:700}.reader table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}.reader th,.reader td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.reader th{background:var(--surface)}.notice{padding:20px;border:1px solid var(--line);background:var(--surface);border-radius:18px;color:var(--muted)}.loading{padding:50px 0;color:var(--muted)}@media(max-width:640px){.top .button{display:none}.shell{padding-left:16px;padding-right:16px}.reader h1{font-size:34px}.reader h2{font-size:25px}}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="index.html">AI Animation Shorts<small>AI-Verse Filmmaking System</small></a><div class="top"><a class="button" href="index.html">← Main page</a><a class="button" href="learn.html">Learn</a><button class="theme" id="theme" aria-label="Switch theme">☀</button></div></header>
<main class="shell">
<section class="hero"><div class="eyebrow" id="kind">ON-SITE READER</div><h1 id="title">Loading document…</h1><p class="subtitle" id="subtitle">This page keeps guides, brains and research inside the website instead of opening raw Markdown.</p><div class="actions" id="actions"></div></section>
<article class="reader" id="content"><div class="loading">Loading…</div></article>
</main>
<script>
const params=new URLSearchParams(location.search),file=params.get('file')||'';
const allowed=/^(assets\/brains|research|tests)\/[A-Za-z0-9_./&()' -]+\.md$/;
const content=document.querySelector('#content'),title=document.querySelector('#title'),kind=document.querySelector('#kind'),subtitle=document.querySelector('#subtitle'),actions=document.querySelector('#actions');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){let v=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');v=v.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,label,href)=>{if(/^https?:/i.test(href))return '<a href="'+href+'" target="_blank" rel="noreferrer">'+label+'</a>';if(/\.md(?:$|#)/i.test(href)){let clean=href.split('#')[0].replace(/^\.\//,'');let base=file.includes('/')?file.slice(0,file.lastIndexOf('/')+1):'';let resolved=clean.startsWith('assets/')||clean.startsWith('research/')||clean.startsWith('tests/')?clean:base+clean;return '<a href="reader.html?file='+encodeURIComponent(resolved)+'">'+label+'</a>'}return '<a href="'+esc(href)+'">'+label+'</a>'});return v}
function render(md){let lines=md.replace(/\r/g,'').split('\n'),out=[],list=null,code=false,buf=[];function close(){if(list){out.push('</'+list+'>');list=null}}function flush(){if(buf.length){let raw=buf.join('\n');out.push('<div class="code"><button class="copycode" data-code="'+encodeURIComponent(raw)+'">Copy</button><pre>'+esc(raw)+'</pre></div>');buf=[]}}for(let i=0;i<lines.length;i++){let raw=lines[i],l=raw.trim();if(l.startsWith('```')){if(code){code=false;flush()}else{close();code=true;buf=[]}continue}if(code){buf.push(raw);continue}if(!l){close();continue}if(/^###\s+/.test(l)){close();out.push('<h3>'+inline(l.slice(4))+'</h3>');continue}if(/^##\s+/.test(l)){close();out.push('<h2>'+inline(l.slice(3))+'</h2>');continue}if(/^#\s+/.test(l)){close();out.push('<h1>'+inline(l.slice(2))+'</h1>');continue}if(/^>\s?/.test(l)){close();out.push('<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>');continue}if(/^\d+\.\s+/.test(l)){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>');continue}if(/^[-*]\s+/.test(l)){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(l.replace(/^[-*]\s+/,''))+'</li>');continue}close();out.push('<p>'+inline(l)+'</p>')}close();if(code)flush();return out.join('')}
function copyText(t){return navigator.clipboard?.writeText?navigator.clipboard.writeText(t):Promise.resolve()}
if(!allowed.test(file)){title.textContent='Document not available';subtitle.textContent='This reader only opens public Brain, research and test Markdown from this project.';content.innerHTML='<div class="notice">Return to the main page and open the document from there.</div>'}
else fetch(file).then(r=>{if(!r.ok)throw new Error('not found');return r.text()}).then(md=>{let first=(md.match(/^#\s+(.+)$/m)||[])[1]||file.split('/').pop().replace(/\.md$/,'').replace(/-/g,' ');title.textContent=first;document.title=first+' | AI Animation Shorts';let isBrain=file.startsWith('assets/brains/');kind.textContent=isBrain?'AI FILM BRAIN':'PROJECT DOCUMENT';subtitle.textContent=isBrain?'Read it here, copy it, or download the Markdown file to attach to your AI chat.':'Read the project guide or research inside the website.';actions.innerHTML='<a class="button primary" href="'+file+'" download>Download .md</a><button class="button" id="copyall">Copy full text</button><a class="button" href="index.html#brains">Back to Brain library</a>';document.querySelector('#copyall').onclick=()=>{copyText(md);let b=document.querySelector('#copyall');b.textContent='Copied';setTimeout(()=>b.textContent='Copy full text',1400)};content.innerHTML=render(md);content.querySelectorAll('.copycode').forEach(b=>b.onclick=()=>{copyText(decodeURIComponent(b.dataset.code));b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)})}).catch(()=>{title.textContent='Could not load this document';content.innerHTML='<div class="notice">The file could not be loaded. Return to the main page and try again.</div>'});
let theme=document.querySelector('#theme');function setTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'☾':'☀';document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#000':'#fff';localStorage.setItem('ai-animation-theme-v1',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('ai-animation-theme-v1')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
</script>
</body>
</html>
