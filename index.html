x-width:600px){.role-grid{grid-template-columns:1fr}.brain-library-intro{margin-top:18px}.intro-band{padding:20px}.pipeline{gap:6px}}</style></head><body><header class="bar"><a class="brand" href="#home">AI Animation Shorts</a><button class="theme" id="theme" aria-checked="false" aria-label="Switch theme">☀</button></header><div class="shell"><aside class="rail"><div class="rail-label">Course</div><button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-expanded="false" aria-controls="nav"><span>Course menu</span><b id="mobile-nav-current">Choose a section</b></button><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div><script id="course-data" type="application/json">{"title":"AI Animation Shorts","modules":[{"number":"01","id":"study","title":"Study animation shorts","promise":"See what makes a small animated story stay with you.","lessons":[1,2,3]},{"number":"02","id":"story","title":"Write one small story","promise":"Turn one feeling into a clear beginning, change and ending.","lessons":[4,5,6,7,8]},{"number":"03","id":"world","title":"Build a world people believe","promise":"Create one character, one place and a few visual rules.","lessons":[9,10,11,12]},{"number":"04","id":"plan","title":"Plan shots before generating","promise":"Make every image and clip serve a specific story beat.","lessons":[13,14,15]},{"number":"05","id":"stills","title":"Make your key animation stills","promise":"Generate original characters, places and moments that match.","lessons":[16,17,18,19]},{"number":"06","id":"motion","title":"Animate with purpose","promise":"Create movement that reveals change instead of random motion.","lessons":[20,21,22,23]},{"number":"07","id":"sound","title":"Use sound and pace","promise":"Give the short rhythm, silence and emotional shape.","lessons":[24,25,26]},{"number":"08","id":"finish","title":"Finish your first short","promise":"Assemble, review and export a simple original animation.","lessons":[27,28,29]},{"number":"09","id":"repeat","title":"Make the next one stronger","promise":"Learn from the first short and build a repeatable process.","lessons":[30]}],"lessons":[{"id":"lesson-01","number":1,"module":"study","title":"Study award-winning shorts without copying","kind":"Story","status":"practice","visual":null,"body":"## Study, do not copy\n\nAward-winning shorts are useful because they show how much a clear emotional idea can do in a few minutes. We study transferable choices such as a single point of view, a visible obstacle, a meaningful turn and a final image that completes the feeling. Do not copy a film’s plot, dialogue, character, visual style or exact shots.\n\n## Award study links\n\n- [Academy Awards, 2025 Animated Short Film winner](https://www.oscars.org/oscars/ceremonies/2025)\n- [Academy Awards, 2024 Animated Short Film winner](https://www.oscars.org/oscars/ceremonies/2024)\n- [BAFTA British Short Animation winners](https://bafta.org/awards/film/british-short-animation)\n- [Annecy 2025 award results](https://www.annecyfestival.com/en/le-festival/2025-awards)\n\n## Do this\n\n1. Watch three short animations you legally have access to.\n2. For each one, write one sentence for: who we follow, what they want, what gets in the way, what changes and what the last image makes you feel.\n3. Do not save frames, copy dialogue or recreate the film. Save only your own plain-language observations.\n\n## Check your result\n\nYou can explain the emotional movement of each short without describing its whole plot.\n\n## Save\n\nSave as `01-award-short-observations.md`.\n","brain":"story/00-AWARD-WINNING-ANIMATION-STORY-BRAIN.md","brainLabel":"Award-Winning Animation Story Brain","brainReason":"Study story mechanisms without copying films."},{"id":"lesson-02","number":2,"module":"study","title":"Find the one feeling your short will carry","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nChoose one feeling that the viewer should carry away from your short.\n\n## Why this matters\n\nA small film becomes clearer when it is built around one emotional destination instead of many unrelated ideas.\n\n## Before you start\n\nA blank note and ten quiet minutes.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write three feelings you know personally, such as relief, jealousy, homesickness or courage.\n2. Choose one feeling that could be shown through an action, not explained in dialogue.\n3. Write: “At the end, I want the viewer to feel ____.”\n4. Keep that sentence at the top of every planning page.\n\n## Check your result\n\nYour feeling is specific enough that two people would imagine different actions for it.\n\n## If it goes wrong\n\nIf you chose a broad word like “love”, narrow it to a moment, such as “the relief of being forgiven.”\n\n## Save\n\nSave as `02-final-feeling.md`.\n\n## Next\n\nNow give one character a simple want that can carry that feeling.\n","brain":"story/01-IDEA-STORY-ARCHITECT.md","brainLabel":"Idea Story Architect","brainReason":"Turn the feeling into a small original concept."},{"id":"lesson-03","number":3,"module":"study","title":"Give one character one clear want","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nCreate a main character with a visible want.\n\n## Why this matters\n\nThe viewer can follow a short film quickly when they know what one person, creature or object is trying to do.\n\n## Before you start\n\nYour final-feeling sentence.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Choose a character you can describe in one ordinary line.\n2. Give them one small visible want they can try to achieve on screen.\n3. Write one reason the want matters today.\n4. Remove every second goal.\n\n## Check your result\n\nYou can complete: “We follow ___ who wants ___ before ___.”\n\n## If it goes wrong\n\nIf the character wants an abstract idea, turn it into an action they can attempt.\n\n## Save\n\nSave as `03-character-want.md`.\n\n## Next\n\nBuild the obstacle that makes the attempt interesting.\n","brain":"story/01-IDEA-STORY-ARCHITECT.md","brainLabel":"Idea Story Architect","brainReason":"Give the protagonist a visible want."},{"id":"lesson-04","number":4,"module":"story","title":"Write a one-sentence premise","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nTurn your character and want into a simple original premise.\n\n## Why this matters\n\nA premise prevents beautiful AI images from becoming disconnected clips.\n\n## Before you start\n\nYour character and one clear want.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Use this shape: “A ___ wants ___, but ___.”\n2. Write five versions.\n3. Choose the version with a physical obstacle or choice.\n4. Keep it under 25 words.\n\n## Copy this prompt\n\n```text\nHelp me write five original animated-short premises. Each uses one character, one visible want and one clear obstacle. Keep every premise under 25 words. Do not imitate existing films, studios, artists or characters.\n```\n\n## Check your result\n\nYour sentence contains a character, want and obstacle.\n\n## If it goes wrong\n\nIf it sounds like a feature film, make the want smaller and limit the world to one place or one day.\n\n## Save\n\nSave as `04-one-sentence-premise.md`.\n\n## Next\n\nDecide what makes the obstacle hard now.\n","brain":"story/02-SYNOPSIS-ARCHITECT.md","brainLabel":"Synopsis Architect","brainReason":"Shape the premise into a clear short story."},{"id":"lesson-05","number":5,"module":"story","title":"Make the obstacle personal","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nChoose an obstacle that changes how your character feels or acts.\n\n## Why this matters\n\nA random problem creates activity. A personal problem creates a story.\n\n## Before you start\n\nYour selected premise.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Ask what the character might lose if they fail.\n2. Choose one obstacle that cannot be solved immediately.\n3. Make the obstacle visible in the world or another character.\n4. Write the one choice the character will have to make.\n\n## Check your result\n\nThe obstacle forces a choice, not just more movement.\n\n## If it goes wrong\n\nIf the problem can be fixed with one easy action, add a cost, a deadline or a trade-off.\n\n## Save\n\nSave as `05-obstacle-and-choice.md`.\n\n## Next\n\nUse that choice to create a turn.\n","brain":"story/02-SYNOPSIS-ARCHITECT.md","brainLabel":"Synopsis Architect","brainReason":"Make the obstacle change the story."},{"id":"lesson-06","number":6,"module":"story","title":"Plan the story turn","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nWrite the moment when the short changes direction.\n\n## Why this matters\n\nThe turn gives a short film a reason to keep moving after the setup.\n\n## Before you start\n\nYour premise and obstacle.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write what the viewer expects to happen.\n2. Write one believable event that changes that expectation.\n3. Make the event come from the character’s action or the world rule.\n4. Write the new choice it creates.\n\n## Copy this prompt\n\n```text\nGive me three original story-turn options for this premise: [PASTE PREMISE]. Each turn must come from the character’s action or a stated world rule. Do not add a random rescue.\n```\n\n## Check your result\n\nThe turn changes the character’s plan and makes the ending possible.\n\n## If it goes wrong\n\nIf the turn feels like a surprise for its own sake, connect it to a clue placed in the beginning.\n\n## Save\n\nSave as `06-story-turn.md`.\n\n## Next\n\nChoose a final image that closes the feeling.\n","brain":"story/00-AWARD-WINNING-ANIMATION-STORY-BRAIN.md","brainLabel":"Award-Winning Animation Story Brain","brainReason":"Find and strengthen the visible turn."},{"id":"lesson-07","number":7,"module":"story","title":"Choose the final image","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nPlan a last image that leaves the viewer with the intended feeling.\n\n## Why this matters\n\nIn a short animation, the final image can carry more meaning than another explanation.\n\n## Before you start\n\nYour final feeling and story turn.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write the character’s state at the beginning.\n2. Write how they are different at the end.\n3. Choose one simple image that shows this difference.\n4. Avoid text that explains the lesson.\n\n## Check your result\n\nA viewer could understand the emotional change from the first and final images alone.\n\n## If it goes wrong\n\nIf your ending needs a speech, look for an action, object or empty space that can show it.\n\n## Save\n\nSave as `07-final-image.md`.\n\n## Next\n\nTurn the whole idea into eight small beats.\n","brain":"story/00-AWARD-WINNING-ANIMATION-STORY-BRAIN.md","brainLabel":"Award-Winning Animation Story Brain","brainReason":"Make the ending image earn its place."},{"id":"lesson-08","number":8,"module":"story","title":"Make an eight-beat short map","kind":"Story","status":"practice","visual":null,"body":"## What you can do\n\nCreate a compact map for the whole short.\n\n## Why this matters\n\nEight beats are enough to map the emotional movement of a one to three minute animation. They do not require eight separate shots. For a first 30–60 second film, combine them into about six purposeful shots.\n\n## Before you start\n\nYour premise, obstacle, turn and final image.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write: ordinary moment, want, first try, obstacle, second try, turn, choice, final image.\n2. Use one short sentence per beat.\n3. Remove beats that repeat the same emotion.\n4. Read it aloud in under one minute.\n\n## Copy this prompt\n\n```text\nTurn this original premise into an eight-beat animated short map: [PASTE PREMISE]. Use: ordinary moment, want, first try, obstacle, second try, turn, choice, final image. Keep every beat visual and concise. Do not imitate existing films.\n```\n\n## Check your result\n\nEvery beat changes the situation or reveals something new.\n\n## If it goes wrong\n\nIf two beats do the same job, merge them.\n\n## Save\n\nSave as `08-eight-beat-map.md`.\n\n## Screenplay choice\n\nThis course can continue from the eight-beat map. A formal screenplay is optional. Use the Animation Screenwriter brain only if you need dialogue, scene headings or more production detail.\n\n## Next\n\nNow create the character and world rules that make the images consistent.\n","brain":"story/02-SYNOPSIS-ARCHITECT.md","brainLabel":"Synopsis Architect","brainReason":"Turn the beats into a production-ready synopsis."},{"id":"lesson-09","number":9,"module":"world","title":"Create a character identity sheet","kind":"Planning","status":"research","visual":null,"body":"## What you can do\n\nDescribe one original character clearly enough to recreate them across shots.\n\n## Why this matters\n\nConsistency starts with decisions before prompts. AI cannot protect details you never define.\n\n## Before you start\n\nYour eight-beat map.\n\n## Use this platform\n\nNotes app or a general-purpose AI chat\n\n## Use this route\n\nText planning. Do not generate images yet.\n\n**Status: PRACTICE WORKFLOW.** This step defines what the later image generator must preserve.\n\n## Do this\n\n1. Choose age range, silhouette, posture, clothing and one meaningful object.\n2. Write what they do when nervous or hopeful.\n3. Choose two colours that support the feeling.\n4. Write what must never change.\n\n## Copy this prompt\n\n```text\nCreate an original animation character identity sheet in plain language. Character role: [ROLE]. Feeling of the short: [FEELING]. Include silhouette, posture, wardrobe, one meaningful object, two key colours, expression range and non-negotiable continuity details. Do not imitate any existing character, studio or artist.\n```\n\n## Check your result\n\nYou have five to eight details that another person could recognise in every shot.\n\n## If it goes wrong\n\nIf the sheet is only adjectives, add visible decisions such as a worn coat, a square backpack or a careful walk.\n\n## Save\n\nSave as `09-character-identity.md`.\n\n## Next\n\nGive the character one focused place to live in.\n","brain":"preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md","brainLabel":"Consistency and Reference Director","brainReason":"Extract only the character details worth locking."},{"id":"lesson-10","number":10,"module":"world","title":"Build one story location","kind":"Planning","status":"research","visual":null,"body":"## What you can do\n\nDesign one location that supports the character’s problem.\n\n## Why this matters\n\nA short is easier to make when it uses one memorable place instead of many loosely connected backgrounds.\n\n## Before you start\n\nCharacter identity sheet.\n\n## Use this platform\n\nNotes app or a general-purpose AI chat\n\n## Use this route\n\nText planning. Do not generate images yet.\n\n**Status: PRACTICE WORKFLOW.** This step defines what the later image generator must preserve.\n\n## Do this\n\n1. Choose the place where most of the short happens.\n2. List three useful objects and one limitation of the space.\n3. Choose time of day and weather only if they affect the story.\n4. Write what the location looks like before and after the change.\n\n## Copy this prompt\n\n```text\nDesign one original animated-short location for this premise: [PASTE PREMISE]. Include a clear layout, three story-useful objects, one visual limitation, lighting mood and details that can stay consistent across multiple shots. Do not imitate a named film, artist or studio.\n```\n\n## Check your result\n\nThe location gives the character useful things to do and a clear place to be.\n\n## If it goes wrong\n\nIf the location is only decorative, add an object or route that creates the obstacle.\n\n## Save\n\nSave as `10-location-rules.md`.\n\n## Next\n\nSet the visual rules that connect character and place.\n","brain":"preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md","brainLabel":"Consistency and Reference Director","brainReason":"Lock the location and its fixed anchors."},{"id":"lesson-11","number":11,"module":"world","title":"Choose your visual rules","kind":"Planning","status":"research","visual":null,"body":"## What you can do\n\nCreate a small visual rule set for your original short.\n\n## Why this matters\n\nA consistent visual language makes separate generations feel like one film.\n\n## Before you start\n\nCharacter and location sheets.\n\n## Use this platform\n\nNotes app or a general-purpose AI chat\n\n## Use this route\n\nText planning. Do not generate images yet.\n\n**Status: PRACTICE WORKFLOW.** This step defines what the later image generator must preserve.\n\n## Do this\n\n1. Choose one material feeling, such as paper, painted clay, ink or clean graphic shapes.\n2. Choose one line or edge rule.\n3. Choose a simple light rule.\n4. Choose what images must avoid.\n\n## Copy this prompt\n\n```text\nCreate a compact visual rule set for an original animated short. Emotion: [FEELING]. Character: [CHARACTER]. Location: [LOCATION]. Include material feeling, shape language, light rule, colour limits, texture limits and a short avoid list. Do not copy a named artist, studio, film or animation style.\n```\n\n## Check your result\n\nYour rule set could help reject an image that is beautiful but belongs to another film.\n\n## If it goes wrong\n\nIf it lists too many style words, keep one material, one line rule, one light rule and two colours.\n\n## Save\n\nSave as `11-visual-rules.md`.\n\n## Next\n\nTurn the rules into a small reference board.\n","brain":"preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md","brainLabel":"Consistency and Reference Director","brainReason":"Preserve the chosen animation medium and visual rules."},{"id":"lesson-12","number":12,"module":"world","title":"Make a four-image reference board","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate four actual reference images and compare them side by side.\n\n## What a reference board is\n\nA reference board is a small set of approved images that shows the character, world and important object before you make story shots. It is not a folder of random inspiration.\n\n## Before you start\n\nCharacter identity, location rules and visual rules from Lessons 9–11.\n\n## Use this platform\n\nAn image generator that accepts written prompts, lets you upload reference images when you have them, and lets you download PNG or JPG files.\n\n## Use this route\n\nCreate one image at a time. If your tool cannot use image references, reuse the same exact written locks and expect more variation.\n\n**Status: RESEARCHED · RUN AND REVIEW IN YOUR OWN TOOL.** Features vary by account and model.\n\n## Do this\n\n1. Generate several versions of the character full-body view. Approve one and download it as `REF-CHAR-01-full.png`.\n2. Upload that approved image as the reference for a closer view. Download the winner as `REF-CHAR-01-close.png`.\n3. Generate the wide location and download it as `REF-WORLD-01-wide.png`.\n4. Generate the important object and download it as `REF-PROP-01.png`.\n5. Put the four images on one page in any presentation, drawing or layout app. If you have no layout app, view the four files together in one folder.\n6. Compare them side by side. Reject any image that changes the character identity, medium, palette, materials or world rules.\n7. Save the board as `12-reference-board.jpg` or `.pdf`, and keep the four original image files.\n\n## Copy this prompt\n\n```text\nPASTE INTO IMAGE GENERATOR\nCreate one original animated-film reference image. Subject: [CHARACTER, LOCATION OR OBJECT]. Preserve these written locks: [PASTE VISUAL RULES]. Use a clear readable view, simple neutral presentation where appropriate, no captions, no watermark, no existing franchise and no imitation of a named artist or studio.\n```\n\n## Check your result\n\nWhen viewed side by side, all four images share the same character identity, animation medium, colour limits and world. The original image files are downloaded and clearly named.\n\n## If it goes wrong\n\nReturn to the last approved image and the exact written locks. Do not use a failed generation as the new reference.\n\n## Next\n\nUse the reference board to make a real visual storyboard.\n","brain":"preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md","brainLabel":"Consistency and Reference Director","brainReason":"Build a useful reference package, not a pile of images."},{"id":"lesson-13","number":13,"module":"plan","title":"Turn beats into storyboard frames","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nMake a rough visual storyboard for the whole film before generating polished shots.\n\n## What a storyboard is\n\nA storyboard is a sequence of simple pictures that shows what the viewer sees in order. Stick figures and rough boxes are enough. It is a thinking tool, not finished art.\n\n## Before you start\n\nEight-beat map and four-image reference board.\n\n## Use this platform\n\nPaper plus a phone camera, any drawing or presentation app, or an image generator that can create a numbered grid.\n\n## Do this\n\n1. Draw or create eight boxes in reading order.\n2. Put one beat in each box. Combine beats later when one shot can carry two simple moments.\n3. Under every panel, write the beat number and one sentence describing what visibly changes.\n4. Keep screen direction and the location layout readable.\n5. Show the board to someone without explaining the story.\n6. Save or photograph it as `13-storyboard-v01.jpg` or `.pdf`.\n\n## Optional AI prompt\n\n```text\nPASTE INTO IMAGE GENERATOR\nUsing the attached approved references, create one simple cohesive 2x4 storyboard grid for these eight beats: [PASTE BEATS]. Keep the same character, location, animation medium and visual rules. Number panels 1–8 underneath. Each panel must show one readable story change. This is a rough planning board, not finished key art.\n```\n\n## Check your result\n\nA first viewer can point to the character, obstacle, turn and final image in the correct order.\n\n## If it goes wrong\n\nIf a panel contains two unrelated changes, simplify it or add a shot later. If the AI grid drifts, draw rough boxes manually instead of accepting false continuity.\n\n## Next\n\nTurn the board into a complete shot coverage list.\n","brain":"preproduction/05-STORYBOARD-DIRECTOR.md","brainLabel":"Storyboard Director","brainReason":"Choose the grid or production storyboard that fits."},{"id":"lesson-14","number":14,"module":"plan","title":"Write a purpose-first shot and motion list","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nTurn eight story beats into about six complete, purposeful shots for a first 30–60 second film.\n\n## Before you start\n\nYour visual storyboard.\n\n## Use this platform\n\nNotes app or general-purpose AI chat.\n\n## Do this\n\n1. Give each editorial shot one stable ID: `SHOT-01`, `SHOT-02` and so on.\n2. Map every beat to at least one shot. One shot may carry two simple connected beats.\n3. For each shot, write the story job, visible start, primary action, visible end and intended duration.\n4. Target roughly 5–8 seconds per shot for the first film, then adjust so the total is 30–60 seconds.\n5. Mark whether the shot needs a still hold, character action, camera move or transition.\n6. Confirm there are no missing beats and no accidental time gaps.\n\n## Save this coverage table\n\n```text\nSHOT ID | BEAT(S) | STORY JOB | START STATE | PRIMARY ACTION | END STATE | TARGET SECONDS | STILL OR VIDEO\n```\n\n## Check your result\n\nEvery beat appears, the intended durations total 30–60 seconds, and every shot has one main job.\n\n## If it goes wrong\n\nIf a shot has two competing actions, split it. If the film becomes too long, combine connected beats or use an intentional still hold rather than dropping the final image.\n\n## Save\n\nSave as `14-shot-coverage-v01.md`.\n\n## Next\n\nPackage the exact references and prompt inputs for each shot.\n","brain":"preproduction/05-STORYBOARD-DIRECTOR.md","brainLabel":"Storyboard Director","brainReason":"Give each shot one narrative job and one motion idea."},{"id":"lesson-15","number":15,"module":"plan","title":"Package shot references","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nPrepare clean references before generating a shot.\n\n## Why this matters\n\nA shot is more consistent when you tell the generator what must stay fixed.\n\n## Before you start\n\nReference board, shot list and motion plan.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. For each `SHOT-##`, list its exact character reference filename, location reference filename and key object reference filename.\n2. Write the beat, emotion and exact action.\n3. State what must not change.\n4. Keep one line for the desired frame shape.\n5. Add a return record for every generation: filename, shot ID, tool/model/date, source reference, exact prompt, actual duration when video, observed defect and approval state.\n\n## Check your result\n\nEvery future shot has a small source list and a clear purpose.\n\n## If it goes wrong\n\nIf a shot needs five unrelated inputs, simplify the shot or make a missing reference first.\n\n## Save\n\nSave as `15-shot-reference-map-v01.md`.\n\n## Next\n\nGenerate the still images that form the spine of the short.\n","brain":"preproduction/06-SHOT-SEQUENCE-PACKAGER.md","brainLabel":"Shot and Sequence Packager","brainReason":"Separate shots, sequences and generation blocks."},{"id":"lesson-16","number":16,"module":"stills","title":"Generate your establishing image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a first image that tells the viewer where they are and what matters.\n\n## Why this matters\n\nThe first frame gives the viewer a world, a character position and an emotional promise.\n\n## Before you start\n\nLocation rules, character sheet and Shot 01 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Attach the chosen character and location references.\n2. Paste the prompt with the exact story beat.\n3. Generate three to four versions.\n4. Keep the one with the clearest story information.\n\n## Copy this prompt\n\n```text\nOriginal animated short, establishing frame. Character: [CHARACTER]. Location: [LOCATION]. Story beat: [BEAT]. Keep character identity, location layout and visual rules fixed: [RULES]. The viewer should notice [STORY FOCUS] first. Clear silhouette, readable composition, no text, no logos, no watermark, no imitation of a named film, artist or studio.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nA viewer can tell where they are, who they should watch and the initial emotional tone.\n\n## If it goes wrong\n\nIf the image only looks decorative, state what the viewer must notice first and simplify the background.\n\n## Save\n\nSave as `16-shot-01-establishing.png`.\n\n## Next\n\nGenerate the action image that begins the attempt.\n","brain":"preproduction/07-KEYFRAME-FRAME-DIRECTOR.md","brainLabel":"Keyframe and Frame Director","brainReason":"Create the approved visual anchor."},{"id":"lesson-17","number":17,"module":"stills","title":"Generate the first action image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a still where the character actively tries to get what they want.\n\n## Why this matters\n\nThe story begins moving when the character does something visible.\n\n## Before you start\n\nShot 02 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Attach the same character and location references.\n2. State the exact action and emotional effort.\n3. Keep the action readable in one frame.\n4. Generate versions without changing the core visual rules.\n\n## Copy this prompt\n\n```text\nOriginal animated short, action frame. Same [CHARACTER] in the same [LOCATION]. The character is [EXACT ACTION] because they want [WANT]. Preserve [FIXED DETAILS]. Visual rules: [RULES]. Make the action readable at first glance. No text, logos, watermark or imitation of named work.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nYou can point to the character’s action and explain the want without extra dialogue.\n\n## If it goes wrong\n\nIf the pose is vague, reduce the action to one hand, one object and one direction of movement.\n\n## Save\n\nSave as `17-shot-02-action.png`.\n\n## Next\n\nCreate the obstacle image that changes the plan.\n","brain":"preproduction/07-KEYFRAME-FRAME-DIRECTOR.md","brainLabel":"Keyframe and Frame Director","brainReason":"Prepare a strong frame for the first action."},{"id":"lesson-18","number":18,"module":"stills","title":"Generate the obstacle image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a frame that makes the problem visible.\n\n## Why this matters\n\nThe viewer should not have to guess why the character cannot simply continue.\n\n## Before you start\n\nObstacle beat and Shot 03 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. State the obstacle before style details.\n2. Keep character and location anchors fixed.\n3. Show the character noticing or meeting the obstacle.\n4. Generate several versions and reject any that rewrite the world.\n\n## Copy this prompt\n\n```text\nOriginal animated short, obstacle frame. Same [CHARACTER] and [LOCATION]. The visible obstacle is [OBSTACLE]. Show the character’s immediate reaction. Preserve [FIXED DETAILS]. Visual rules: [RULES]. The obstacle must be legible, specific and story-relevant. No text, logos or imitation of named work.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nThe viewer knows what changed and why the first plan cannot work.\n\n## If it goes wrong\n\nIf the generator invents a new location or extra characters, shorten the prompt and attach only the exact references for this shot.\n\n## Save\n\nSave as `18-shot-03-obstacle.png`.\n\n## Next\n\nCreate the turn image, where the story becomes different.\n","brain":"preproduction/07-KEYFRAME-FRAME-DIRECTOR.md","brainLabel":"Keyframe and Frame Director","brainReason":"Prepare the obstacle state before animation."},{"id":"lesson-19","number":19,"module":"stills","title":"Generate the turn and final images","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate the visual moment that changes the character’s plan, then create the final image that completes the story.\n\n## Why this matters\n\nA strong turn gives the ending a direction instead of making it feel sudden.\n\n## Before you start\n\nStory turn and Shot 04 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. State the turn in one concrete action or discovery.\n2. Keep all earlier continuity anchors.\n3. Show the character looking, choosing or acting differently.\n4. Reject images that add an unrelated surprise.\n5. Generate the approved final image as its own `SHOT-##` using the same references and locks.\n6. Check the opening and final images side by side.\n7. Return to the shot coverage table and repeat the keyframe process for every uncovered shot before animation begins. Every beat must have an approved still or an intentional plan to use a held image.\n\n## Copy this prompt\n\n```text\nOriginal animated short, turning-point frame. Same [CHARACTER] in [LOCATION]. The story changes when [TURN]. Show a readable new choice or discovery. Preserve [FIXED DETAILS]. Visual rules: [RULES]. No text, logos, watermark or imitation of named work.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nThe viewer can see why the character will now act differently.\n\n## If it goes wrong\n\nIf the turn feels random, add one earlier object or rule that makes it feel earned.\n\n## Save\n\nSave the turn and final image using their stable IDs, for example `SHOT-04-turn-v01.png` and `SHOT-06-final-v01.png`.\n\n## Next\n\nConfirm every shot has an approved still, then begin with one motion pilot.\n","brain":"preproduction/07-KEYFRAME-FRAME-DIRECTOR.md","brainLabel":"Keyframe and Frame Director","brainReason":"Protect the turning frame and final payoff."},{"id":"lesson-20","number":20,"module":"motion","title":"Animate one small action","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nTurn one approved still into a short action clip.\n\n## Why this matters\n\nSmall controlled movement is easier to judge and more useful than a dramatic move that breaks continuity.\n\n## Before you start\n\nA final approved still and one sentence describing the action.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Use the still as the start image.\n2. Ask for one action only.\n3. Keep duration short.\n4. Generate multiple versions and watch the entire clip.\n\n## Copy this prompt\n\n```text\nAnimate this original frame. Keep the character, location, design, proportions and lighting fixed. The only action is: [ONE SMALL ACTION]. Movement begins gently, remains physically believable and ends in a clear held pose. No new objects, no camera teleport, no morphing, no text or logo.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nThe character, scene and important object remain recognisable from first frame to last.\n\n## If it goes wrong\n\nIf the clip adds new objects or changes the face, reduce the motion and repeat from the original still.\n\n## Save\n\nSave as `20-shot-animated.mp4`.\n\n## Next\n\nUse a reaction clip to show how the change feels.\n","brain":"production/08-MOTION-ANIMATION-DIRECTOR.md","brainLabel":"Motion and Animation Director","brainReason":"Animate one controlled action from an approved frame."},{"id":"lesson-21","number":21,"module":"motion","title":"Animate a reaction instead of explaining","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nCreate a short reaction clip that lets the viewer feel the story turn.\n\n## Why this matters\n\nA reaction can replace dialogue and make an animated short more universal.\n\n## Before you start\n\nA turn still with a clear character face or body pose.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose one emotion shift, such as worry to relief.\n2. Keep the character mostly in place.\n3. Ask for eye, head, breath or hand movement only.\n4. Review frame by frame for identity drift.\n\n## Copy this prompt\n\n```text\nAnimate this original reaction frame. Preserve identity, costume, proportions, environment and composition. The character moves from [START EMOTION] to [END EMOTION] through a subtle change in eyes, breath, head and hands. Keep camera stable. No new objects, no morphing, no text.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nYou can understand the emotional change with the sound muted.\n\n## If it goes wrong\n\nIf the expression becomes exaggerated or changes identity, ask for smaller movement and a stable camera.\n\n## Save\n\nSave as `21-reaction-clip.mp4`.\n\n## Next\n\nMake one transition that carries the viewer to the next beat.\n","brain":"production/08-MOTION-ANIMATION-DIRECTOR.md","brainLabel":"Motion and Animation Director","brainReason":"Direct a readable reaction instead of adding explanation."},{"id":"lesson-22","number":22,"module":"motion","title":"Build a story transition","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nConnect two story beats with a motivated transition.\n\n## Why this matters\n\nA transition should move the story forward, not hide a broken cut.\n\n## Before you start\n\nThe final frame of one beat and the first frame of the next.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Write what changes between the two moments.\n2. Choose a shared object, movement or direction to connect them.\n3. Use a short clip or simple cut.\n4. Reject transitions that invent a new scene.\n\n## Copy this prompt\n\n```text\nCreate a short original transition from this first frame to this end frame. Preserve character identity and world rules. The transition is motivated by [SHARED ACTION OR OBJECT]. Move smoothly and simply toward the next story beat. Do not introduce new characters, locations, text, logos or unrelated events.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nThe viewer understands that time or situation has moved forward.\n\n## If it goes wrong\n\nIf the transition invents too much, use a clean cut between two approved stills or clips instead.\n\n## Save\n\nSave as `22-story-transition.mp4`.\n\n## Next\n\nAnimate the final held moment with restraint.\n","brain":"production/08-MOTION-ANIMATION-DIRECTOR.md","brainLabel":"Motion and Animation Director","brainReason":"Choose a single-frame, start/end or reference route."},{"id":"lesson-23","number":23,"module":"motion","title":"Protect the final image","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nCreate a final clip that lands on the emotional ending instead of distracting from it.\n\n## Why this matters\n\nThe viewer needs a moment to receive the ending.\n\n## Before you start\n\nYour planned final image.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED · NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose one tiny environmental or character movement.\n2. Hold the final pose long enough to feel it.\n3. Avoid a new plot event.\n4. Watch with sound off before adding audio.\n\n## Copy this prompt\n\n```text\nAnimate this original final image with restraint. Preserve composition, character identity, world rules and final emotional meaning. Use only [TINY MOVEMENT]. End on a stable held image. No new action, no camera move that reveals unseen space, no text or logo.\n```\n\n## Bring the result back\n\nRecord the exact filename, `SHOT-##`, tool/model and date, source reference, exact prompt, actual result, visible defect and `PROPOSED / APPROVED / REJECTED` status. If your AI chat cannot inspect video, provide first, middle and last screenshots plus a factual description of the motion and audio.\n\n## Check your result\n\nThe clip leaves space for the final feeling instead of starting a new scene.\n\n## If it goes wrong\n\nIf the generator keeps adding action, use the still image as the final shot.\n\n## Save\n\nSave as `23-final-moment.mp4`.\n\n## Coverage gate\n\nRepeat the approved motion process for every shot marked VIDEO in `14-shot-coverage-v01.md`. Intentional still holds are allowed. Do not edit until all 30–60 seconds are covered with approved clips or held stills.\n\n## Next\n\nNow plan and source only the sound the film needs.\n","brain":"production/08-MOTION-ANIMATION-DIRECTOR.md","brainLabel":"Motion and Animation Director","brainReason":"Keep the final image stable through the motion pass."},{"id":"lesson-24","number":24,"module":"sound","title":"Choose a sound plan","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nPlan simple sound that supports the short’s emotional movement.\n\n## Why this matters\n\nSound can tell the viewer where to listen and when a change matters.\n\n## Before you start\n\nYour eight-beat map and current clips.\n\n## Use this platform\n\nNotes app or general-purpose AI chat\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. For each beat, write silence, environment, action sound or music shift.\n2. Choose one sound motif linked to the character or want.\n3. Leave at least two moments quiet.\n4. Do not add sound just to fill empty space.\n5. For every voice, music track and sound effect, record whether it is yours, licensed, generated with permitted terms or still `TO VERIFY`.\n6. The Audio brain plans sound. It does not record, license, mix or synchronize audio unless the current AI actually has those tools.\n\n## Copy this prompt\n\n```text\nCreate a simple original sound plan for this eight-beat animated short. For each beat, choose silence, environment, action sound or a music shift. Use one repeated sound motif and preserve quiet moments. Do not reference or imitate existing soundtrack music. [PASTE EIGHT BEATS]\n```\n\n## Check your result\n\nEvery sound choice has a story or feeling reason.\n\n## If it goes wrong\n\nIf every line says music, remove music from two beats and let action or silence carry them.\n\n## Save\n\nSave as `24-sound-and-rights-plan.md`.\n\n## Next\n\nPlace clips in the simplest order that tells the story.\n","brain":"production/09-AUDIO-DIALOGUE-CONTINUITY-DIRECTOR.md","brainLabel":"Audio and Dialogue Continuity Director","brainReason":"Decide music, ambience, dialogue and effects deliberately."},{"id":"lesson-25","number":25,"module":"sound","title":"Build a simple rough cut","kind":"Video editing","status":"practice","visual":null,"body":"## What you can do\n\nPlace your approved stills and clips in order on a real video timeline.\n\n## Before you start\n\nAll approved `SHOT-##` files, the shot coverage list and the sound plan.\n\n## Use this platform\n\nAny video editor that can import PNG/JPG and MP4 files, arrange them on a timeline, add audio and export MP4.\n\n## What a rough cut is\n\nA rough cut is the first simple edited version. Use clean cuts. Do not add decorative transitions yet.\n\n## Do this\n\n1. Create a project with the same aspect ratio and frame rate planned for the film.\n2. Import the approved images, clips and permitted audio.\n3. Place `SHOT-01`, `SHOT-02` and the remaining shots in order.\n4. Trim each clip to its useful action. Hold still images long enough to read.\n5. Add one ambience track and essential sound effects only when they are ready.\n6. Watch once without sound and mark the first confusing moment.\n7. Export a review copy as `25-rough-cut-v01.mp4`.\n\n## Check your result\n\nThe timeline has no accidental gaps, covers the intended 30–60 seconds, and a viewer can describe the basic story after one watch.\n\n## If it goes wrong\n\nIf the story is unclear, repair the earliest missing beat or shot purpose before adding effects. If the frame shape is wrong, fix the timeline settings rather than stretching the images.\n\n## Next\n\nAdjust the timing so the turn and final image land.\n","brain":"post/10-EDIT-PACING-DIRECTOR.md","brainLabel":"Edit and Pacing Director","brainReason":"Assemble a readable rough cut from the shots."},{"id":"lesson-26","number":26,"module":"sound","title":"Pace the turn and ending","kind":"Video editing","status":"practice","visual":null,"body":"## What you can do\n\nAdjust shot length so the viewer feels the change.\n\n## Why this matters\n\nPace is not about making everything fast. It is about giving key moments enough time.\n\n## Before you start\n\nYour rough cut and story turn.\n\n## Use this platform\n\nYour video editor\n\n## Use this route\n\nTimeline editing; no AI model required\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Watch where the viewer first understands the obstacle.\n2. Give the turn a little space before and after it.\n3. Hold the final image longer than an ordinary action.\n4. Remove repeated shots that do not change the story.\n\n## Check your result\n\nThe turn is clear and the final moment has room to land.\n\n## If it goes wrong\n\nIf you solve pacing only by speeding everything up, remove duplicate information instead.\n\n## Save\n\nSave as `26-paced-rough-cut-v02.mp4`.\n\n## Next\n\nCheck the short like a first-time viewer.\n","brain":"post/10-EDIT-PACING-DIRECTOR.md","brainLabel":"Edit and Pacing Director","brainReason":"Protect the turn, pause and final image."},{"id":"lesson-27","number":27,"module":"finish","title":"Run a first-viewer story check","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nFind story problems before final export.\n\n## Why this matters\n\nYou know the idea already. A first viewer shows where the film is only clear inside your head.\n\n## Before you start\n\nYour paced rough cut and one trusted viewer.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Ask them what they think the character wanted.\n2. Ask what changed and how they felt at the end.\n3. Do not explain while they watch.\n4. Write only the points where they were confused.\n\n## Check your result\n\nTheir answers match your premise, turn and final feeling closely enough.\n\n## If it goes wrong\n\nIf they miss the want or turn, add or remake the shot that should make it visible.\n\n## Save\n\nSave as `27-first-viewer-notes.md`.\n\n## Next\n\nRun an identity and continuity check.\n","brain":"post/11-FINAL-FILM-CRITIC-QC.md","brainLabel":"Final Film Critic and QC","brainReason":"Test whether a new viewer understands the story."},{"id":"lesson-28","number":28,"module":"finish","title":"Run a continuity check","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nCatch visual changes that pull the viewer out of the story.\n\n## Why this matters\n\nA small identity change can make an AI animation feel accidental, even when the story is good.\n\n## Before you start\n\nFinal candidate clips in order.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Check face, clothing, props, scale, location layout and light direction across every cut.\n2. Mark only visible continuity breaks.\n3. Regenerate the smallest broken shot from the original references.\n4. Do not recolour the whole film to hide a single failure.\n\n## Check your result\n\nThe character and world remain recognisable through the full sequence.\n\n## If it goes wrong\n\nIf too many shots drift, return to your reference board and rebuild the one core character or location image first.\n\n## Save\n\nSave as `28-continuity-notes.md`.\n\n## Next\n\nFinish one clean version for sharing.\n","brain":"post/11-FINAL-FILM-CRITIC-QC.md","brainLabel":"Final Film Critic and QC","brainReason":"Find continuity and generation failures honestly."},{"id":"lesson-29","number":29,"module":"finish","title":"Export your first original short","kind":"Video editing","status":"practice","visual":null,"body":"## What you can do\n\nCreate one clear final version and a short description of what it is.\n\n## Why this matters\n\nFinishing a small original film teaches more than endlessly improving a collection of clips.\n\n## Before you start\n\nA story-checked, continuity-checked final cut.\n\n## Use this platform\n\nYour video editor\n\n## Use this route\n\nFinal export and playback verification; no AI model required\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Export an H.264 MP4 using the same aspect ratio and frame rate as the timeline. Use at least 1920×1080 for a 16:9 project when the source material supports it.\n2. Write the title, one-sentence premise and a disclosure that it is AI-assisted.\n3. Keep the source prompts and references private unless you want to share them.\n4. Include dialogue captions or subtitles when the film needs them.\n5. Reopen the exported file outside the editor and watch it from beginning to end. Confirm picture, intended audio, duration, frame shape and final-image hold.\n6. Save one final file and stop changing it for a day.\n\n## Check your result\n\nThe MP4 reopens and plays through, its picture and audio are intact, its measured duration matches the film, and you have a title, premise and honest AI-assisted disclosure.\n\n## If it goes wrong\n\nIf you keep changing small details, make a list for version two rather than reopening version one.\n\n## Save\n\nSave as `29-final-original-short.mp4`.\n\n## Next\n\nReview what worked, then make the next short smaller and stronger.\n","brain":"post/11-FINAL-FILM-CRITIC-QC.md","brainLabel":"Final Film Critic and QC","brainReason":"Check the evidence before calling it finished."},{"id":"lesson-30","number":30,"module":"repeat","title":"Make a better second short","kind":"Planning","status":"practice","visual":null,"body":"## What you can do\n\nUse your first finished short to choose a sharper next exercise.\n\n## Why this matters\n\nThe fastest growth comes from repeating the whole story-to-screen loop with a smaller, clearer challenge.\n\n## Before you start\n\nYour first-viewer notes and continuity notes.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED · NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write three things that worked.\n2. Choose one storytelling problem and one AI workflow problem to improve.\n3. Write a new one-sentence premise with one stronger constraint.\n4. Limit the next short to six beats.\n\n## Copy this prompt\n\n```text\nHelp me create three original six-beat animated-short premises. I want to improve [STORY PROBLEM] and [WORKFLOW PROBLEM] from my last project. Each premise needs one character, one clear want, one visible obstacle, one turn and a final image. Do not imitate any existing film, character, studio or artist.\n```\n\n## Check your result\n\nYour next short is smaller in scope but clearer in story challenge.\n\n## If it goes wrong\n\nIf the new idea is bigger than the first, reduce it to one character, one location and one emotional change.\n\n## Save\n\nSave as `30-next-short-brief.md`.\n\n## Next\n\nStart again at the award study, then make something that is unmistakably yours.\n","brain":"post/10-EDIT-PACING-DIRECTOR.md","brainLabel":"Edit and Pacing Director","brainReason":"Use the first short to make the next one clearer."}]}</script><script>
const DATA=JSON.parse(document.querySelector('#course-data').textContent),lessons=DATA.lessons,byId=Object.fromEntries(lessons.map(x=>[x.id,x])),byNum=Object.fromEntries(lessons.map(x=>[x.number,x])),app=document.querySelector('#app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(src){let out=[],list=null,inCode=false,code=[];function close(){if(list){out.push('</'+list+'>');list=null}}function flushCode(){if(code.length){let raw=code.join('\n');out.push('<div class="promptbox"><button class="copy" data-copy="'+encodeURIComponent(raw)+'">Copy prompt</button><pre>'+esc(raw)+'</pre></div>');code=[]}}for(const raw of src.split('\n')){let l=raw.trim();if(l.startsWith('```')){if(inCode){inCode=false;flushCode()}else{close();inCode=true;code=[]}continue}if(inCode){code.push(raw);continue}if(!l){close();continue}if(/^##\s+/.test(l)){close();out.push('<h2>'+inline(l.slice(3))+'</h2>');continue}if(/^>\s+/.test(l)){close();out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');continue}if(/^\d+\.\s+/.test(l)){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>');continue}if(l.startsWith('- ')){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(l.slice(2))+'</li>');continue}close();out.push('<p>'+inline(l)+'</p>')}close();if(inCode)flushCode();return out.join('')}
function nav(){let el=document.querySelector('#nav');el.innerHTML='<a class="nav-start" href="#lesson/lesson-01"><b>START</b><span>Lesson 1</span></a><a href="#tools"><b>OPTIONAL</b><span>AI helpers</span></a>'+DATA.modules.map(m=>'<details class="nav-group" data-module="'+m.id+'"><summary><span class="nav-module-copy"><b>'+m.number+' · '+esc(m.title)+'</b><span>'+m.lessons.length+' lesson'+(m.lessons.length===1?'':'s')+'</span></span></summary><div class="nav-lessons"><a class="nav-overview" href="#module/'+m.id+'">Module overview</a>'+m.lessons.map(n=>{let l=byNum[n];return '<a class="nav-lesson" data-lesson="'+l.id+'" href="#lesson/'+l.id+'"><span class="nav-lesson-no">'+String(l.number).padStart(2,'0')+'</span><span class="nav-lesson-title">'+esc(l.title)+'</span></a>'}).join('')+'</div></details>').join('');el.querySelectorAll('.nav-group').forEach(d=>d.querySelector('summary').addEventListener('click',()=>{if(!d.open)el.querySelectorAll('.nav-group').forEach(other=>{if(other!==d)other.open=false})}));let rail=document.querySelector('.rail'),toggle=document.querySelector('#mobile-nav-toggle');toggle.onclick=()=>{let open=rail.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',open)};el.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=850){rail.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false')}})}

function tools(){app.innerHTML=`<div class="wrap"><div class="module-head"><div class="eyebrow">OPTIONAL AI HELPERS</div><h1>Use one instruction file inside an AI chat.</h1><p>The course works without these files. A brain is optional plain-text guidance that helps a general AI chat perform one filmmaking job. It does not run by itself and does not go directly into an image or video generator.</p></div><section class="intro-band beginner-start"><div class="eyebrow">FIRST TIME USING AI?</div><h2>Start with one file, not the whole library.</h2><p>Use the Master Director in one ongoing general-purpose AI chat. It will ask one useful question at a time. The chat creates decisions, plans and prompts. You manually take approved prompts and references into media tools.</p><div class="actions"><a class="button primary" href="assets/brains/master/MASTER-AI-ANIMATION-DIRECTOR.md" download>Download the Master brain</a><a class="button" href="assets/brains/START-HERE.md">Open the beginner guide</a><a class="button" href="assets/brains/PROJECT-STATE-TEMPLATE.md" download>Download Project State</a></div><p class="source-note">Do not upload all 13 brains together. Use the Master alone for a first film, or one specialist for one focused task.</p></section><section class="intro-band"><div class="eyebrow">WHAT YOU NEED</div><h2>Four tool jobs. They are not the same thing.</h2><div class="role-grid"><div class="role-card"><b>1 · General AI chat</b><span>Reads the brain. Helps with story, plans, prompts and QC.</span></div><div class="role-card"><b>2 · Image generator</b><span>Receives approved image prompts and references. Creates stills.</span></div><div class="role-card"><b>3 · Video generator</b><span>Receives approved frames and motion prompts. Creates clips.</span></div><div class="role-card"><b>4 · Video editor</b><span>Assembles clips, sound and titles. Exports the film.</span></div></div><p>You also need a notes app and one local project folder. Audio may come from your own recording, an audio tool, or a properly licensed library.</p></section><section class="intro-band"><div class="eyebrow">HOW TO ACTIVATE A BRAIN</div><h2>Attach it, or paste its complete text.</h2><ol><li>Start a new chat when using a specialist. Keep one ongoing chat when using the Master.</li><li>Attach one <code>.md</code> file. If the app rejects Markdown, open the file and paste all its text, or save an unchanged <code>.txt</code> copy.</li><li>Attach the latest relevant project file or Project State. A new chat does not automatically remember old attachments.</li><li>Say: <code>Read this as the working instructions for this chat. I am a beginner. Confirm the brain name and ask only the first question.</code></li><li>Save every approved output outside the chat.</li></ol><p class="source-note"><b>Compatibility review: 4 September 2026.</b> ChatGPT documents Markdown uploads. Gemini accepts many file types but support can vary. Claude's documented upload list does not currently name <code>.md</code>, so paste the text or use an unchanged <code>.txt</code>. Hermes Desktop accepts dragged files; other Hermes interfaces vary. Any sufficiently capable text model can work if it can read the complete instructions.</p><p class="source-note">Only upload material you are allowed to share. Check the service's current privacy terms before using confidential work, personal data, likenesses, voices, music or client assets.</p></section><section class="intro-band brain-library-intro"><div class="eyebrow">THE FULL PIPELINE</div><h2>Direct the film in stages. Don't start from zero every time.</h2><p>Each stage keeps approved decisions visible and passes a useful handoff to the next one.</p><div class="pipeline"><div class="pipeline-step"><b>IDEA</b><span>Idea Architect</span></div><div class="pipeline-step"><b>STORY</b><span>Story Brain</span></div><div class="pipeline-step"><b>SYNOPSIS</b><span>Synopsis</span></div><div class="pipeline-step"><b>SCRIPT</b><span>Screenwriter</span></ ogether.</p><div class="brain-group"><div class="eyebrow">STORY</div><div class="tool-grid"><section class="tool-card brain-card"><h3>Award-Winning Animation Story Brain</h3><p>Build emotional clarity, visual storytelling and earned endings.</p><div class="brain-use"><b>Give it:</b> Give it an idea, synopsis, script or rough cut.</div><div class="brain-use"><b>Use it:</b> Story stage</div><div class="brain-actions"><a class="button" href="assets/brains/story/00-AWARD-WINNING-ANIMATION-STORY-BRAIN.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/story/00-AWARD-WINNING-ANIMATION-STORY-BRAIN.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Idea Story Architect</h3><p>Turn a rough thought into 2-3 strong original directions.</p><div class="brain-use"><b>Give it:</b> Give it a feeling, image, object or sentence.</div><div class="brain-use"><b>Use it:</b> Story stage</div><div class="brain-actions"><a class="button" href="assets/brains/story/01-IDEA-STORY-ARCHITECT.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/story/01-IDEA-STORY-ARCHITECT.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Synopsis Architect</h3><p>Build or repair a compact visual synopsis.</p><div class="brain-use"><b>Give it:</b> Give it the approved idea or existing synopsis.</div><div class="brain-use"><b>Use it:</b> Story stage</div><div class="brain-actions"><a class="button" href="assets/brains/story/02-SYNOPSIS-ARCHITECT.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/story/02-SYNOPSIS-ARCHITECT.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Animation Screenwriter</h3><p>Turn the synopsis into visible, producible action.</p><div class="brain-use"><b>Give it:</b> Give it the approved synopsis and runtime.</div><div class="brain-use"><b>Use it:</b> Story stage</div><div class="brain-actions"><a class="button" href="assets/brains/story/03-ANIMATION-SCREENWRITER.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/story/03-ANIMATION-SCREENWRITER.md">Copy brain text</button></div></section></div></div><div class="brain-group"><div class="eyebrow">PRE-PRODUCTION</div><div class="tool-grid"><section class="tool-card brain-card"><h3>Consistency and Reference Director</h3><p>Read the script and identify only the references worth locking.</p><div class="brain-use"><b>Give it:</b> Give it the script and any real reference images.</div><div class="brain-use"><b>Use it:</b> Pre-Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/preproduction/04-CONSISTENCY-REFERENCE-DIRECTOR.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Storyboard Director</h3><p>Choose the right grid or production storyboard method.</p><div class="brain-use"><b>Give it:</b> Give it the story, locks, images and intended scene.</div><div class="brain-use"><b>Use it:</b> Pre-Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/preproduction/05-STORYBOARD-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/preproduction/05-STORYBOARD-DIRECTOR.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Shot and Sequence Packager</h3><p>Separate film, scenes, shots and generation blocks.</p><div class="brain-use"><b>Give it:</b> Give it the script, storyboard, runtime and chosen route.</div><div class="brain-use"><b>Use it:</b> Pre-Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/preproduction/06-SHOT-SEQUENCE-PACKAGER.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/preproduction/06-SHOT-SEQUENCE-PACKAGER.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Keyframe and Frame Director</h3><p>Extract or design approved start, end and key frames.</p><div class="brain-use"><b>Give it:</b> Give it a storyboard, frame or visual brief.</div><div class="brain-use"><b>Use it:</b> Pre-Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/preproduction/07-KEYFRAME-FRAME-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/preproduction/07-KEYFRAME-FRAME-DIRECTOR.md">Copy brain text</button></div></section></div></div><div class="brain-group"><div class="eyebrow">PRODUCTION</div><div class="tool-grid"><section class="tool-card brain-card"><h3>Motion and Animation Director</h3><p>Turn one approved shot into a concise motion instruction.</p><div class="brain-use"><b>Give it:</b> Give it the shot, locks and selected references.</div><div class="brain-use"><b>Use it:</b> Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/production/08-MOTION-ANIMATION-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/production/08-MOTION-ANIMATION-DIRECTOR.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Audio and Dialogue Continuity Director</h3><p>Keep voice, ambience, effects and music coherent across clips.</p><div class="brain-use"><b>Give it:</b> Give it the script, shot plan and audio intention.</div><div class="brain-use"><b>Use it:</b> Production stage</div><div class="brain-actions"><a class="button" href="assets/brains/production/09-AUDIO-DIALOGUE-CONTINUITY-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/production/09-AUDIO-DIALOGUE-CONTINUITY-DIRECTOR.md">Copy brain text</button></div></section></div></div><div class="brain-group"><div class="eyebrow">POST</div><div class="tool-grid"><section class="tool-card brain-card"><h3>Edit and Pacing Director</h3><p>Build the rough cut and protect the emotional rhythm.</p><div class="brain-use"><b>Give it:</b> Give it the shot list, durations, dialogue and story goal.</div><div class="brain-use"><b>Use it:</b> Post stage</div><div class="brain-actions"><a class="button" href="assets/brains/post/10-EDIT-PACING-DIRECTOR.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/post/10-EDIT-PACING-DIRECTOR.md">Copy brain text</button></div></section><section class="tool-card brain-card"><h3>Final Film Critic and QC</h3><p>Review story, originality, continuity, motion, audio and evidence.</p><div class="brain-use"><b>Give it:</b> Give it the finished film, plan or review notes.</div><div class="brain-use"><b>Use it:</b> Post stage</div><div class="brain-actions"><a class="button" href="assets/brains/post/11-FINAL-FILM-CRITIC-QC.md" download>Download .md ↗</a><button class="copy-brain" data-brain="assets/brains/post/11-FINAL-FILM-CRITIC-QC.md">Copy brain text</button></div></section></div></div></details><div class="brain-sources"><div class="eyebrow">RESEARCH AND METHOD</div><p>These files are grounded in award research, current AI filmmaking sources and the AI-Verse Sprint 2 production method.</p><p><a href="research/sprint-2-methodology-and-brain-architecture.md">Sprint 2 method and architecture ↗</a> &nbsp; <a href="research/ai-film-workflow-research-2026-09-04.md">Current workflow research ↗</a> &nbsp; <a href="research/official-ai-film-workflows-2026-09-04.md">Official capability reference ↗</a> &nbsp; <a href="research/creator-ai-film-case-studies-2026-09-04.md">Creator case studies ↗</a> &nbsp; <a href="research/current-2026-capability-addendum-2026-09-04.md">2026 capability addendum ↗</a> &nbsp; <a href="research/academy-awards-research.md">Award research ↗</a> &nbsp; <a href="tests/last-drop-end-to-end.md">End-to-end test ↗</a></p></div><section class="intro-band"><div class="eyebrow">REMEMBER</ ntity sheets and approved shots together.</div><button class="button '+(done.has(l.id)?'primary':'')+'" id="complete">'+(done.has(l.id)?'Completed':'Mark complete and open next')+'</button></aside></div></div>';document.querySelector('#complete').onclick=()=>{done.add(l.id);localStorage.setItem('ai-animation-done-v1',JSON.stringify([...done]));let target=next?'#lesson/'+next.id:'#home';location.hash=target;route()}}
function route(){let h=location.hash.slice(1)||'home';syncNav(h);if(h==='home'){setMeta('Course home','A story-first course for creating original AI-assisted animated shorts.');home()}else if(h==='tools'){setMeta('AI Film Brains','Download portable AI filmmaking brains for every stage of an animated short.');tools()}else if(h==='curriculum'){setMeta('Course curriculum','Thirty practical lessons from story idea to finished animated short.');curriculum()}else if(h.startsWith('module/')){modulePage(h.split('/')[1])}else if(h.startsWith('lesson/')){let x=byId[h.split('/')[1]];if(x)setMeta(x.title,'Lesson '+x.number+' of the AI Animation Shorts course.');lesson(h.split('/')[1])}else home();scrollTo(0,0)}
function copyText(t){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(t).catch(()=>legacy(t));return Promise.resolve(legacy(t))}function legacy(t){let x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.append(x);x.select();document.execCommand('copy');x.remove()}document.addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(b){copyText(decodeURIComponent(b.dataset.copy));b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1400)}});let theme=document.querySelector('#theme');function setTheme(v){document.documentElement.dataset.theme=v;theme.setAttribute('aria-checked',v==='dark');theme.textContent=v==='dark'?'☾':'☀';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#000':'#fff';localStorage.setItem('ai-animation-theme-v1',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('ai-animation-theme-v1')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));nav();addEventListener('hashchange',route);route();
