*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}.bar{height:70px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,60px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}.brand{color:var(--ink);text-decoration:none;font-weight:760;letter-spacing:-.035em;font-size:17px}.brand small{display:block;font-size:9px;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.top-actions{display:flex;gap:8px}.button,.theme{min-height:43px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:0 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:680}.button.primary{background:var(--accent);color:white;border-color:var(--accent)}.theme{width:48px;padding:0}.shell{max-width:1540px;margin:auto;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 70px)}.rail{border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.rail-label,.eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}.nav{margin-top:12px}.nav a{display:block;padding:10px 11px;border-radius:12px;text-decoration:none;color:var(--muted);margin:3px 0;line-height:1.18}.nav a:hover,.nav a.active{color:var(--ink);background:var(--surface)}.nav b{display:block;font-size:13px}.nav span{font-size:11px}.main{min-width:0}.wrap{max-width:1120px;padding:clamp(34px,6vw,84px) clamp(18px,5vw,72px);margin:auto}.hero{min-height:calc(100vh - 70px);display:grid;align-content:center;gap:25px}.hero h1{font-size:clamp(44px,7vw,94px);line-height:.98;letter-spacing:-.07em;max-width:960px;margin:0}.hero p{font-size:clamp(18px,2vw,23px);color:var(--muted);max-width:680px;margin:0}.hero .actions{display:flex;flex-wrap:wrap;gap:11px}.proof{margin-top:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.proof figure,.visual{margin:0;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}.proof img,.visual img{display:block;width:100%;height:100%;object-fit:cover}.proof figcaption{padding:13px 15px;font-size:13px;color:var(--muted)}.stat{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;align-content:center;gap:7px}.stat strong{font-size:44px;letter-spacing:-.06em}.stat p{font-size:14px}.start-card{margin-top:70px;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px}.start-card h2{margin:8px 0;font-size:28px;letter-spacing:-.04em}.module-head{display:grid;gap:13px;margin-bottom:34px}.module-head h1{font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.06em;margin:0}.module-head p{font-size:19px;color:var(--muted);max-width:680px;margin:0}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.lesson-card{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:var(--ink);background:var(--bg);min-height:190px}.lesson-card:hover{background:var(--surface);border-color:var(--accent)}.lesson-no{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.lesson-card h2{margin:0;font-size:22px;line-height:1.12;letter-spacing:-.045em}.lesson-card p{margin:0;color:var(--muted);font-size:14px}.lesson-top{display:flex;gap:16px;align-items:flex-start}.lesson-top h1{margin:3px 0 0;font-size:clamp(32px,4.2vw,55px);line-height:1;letter-spacing:-.06em}.lesson-number{font-size:14px;font-weight:800;color:var(--accent);padding-top:8px}.crumb{font-size:13px;color:var(--muted);text-decoration:none}.crumb:hover{color:var(--accent)}.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.badge{font-size:11px;letter-spacing:.08em;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}.badge.tested{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px}.reader{min-width:0}.side{display:grid;align-content:start;gap:12px}.side-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:13px}.side-card b{display:block;margin-bottom:5px}.visual-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:26px 0 8px}.visual img{aspect-ratio:3/2}.visual figcaption{padding:10px 12px;font-size:12px;color:var(--muted)}.visual-caption{font-size:13px;color:var(--muted);margin:0 0 30px}.md h2{margin:40px 0 12px;font-size:25px;line-height:1.1;letter-spacing:-.04em}.md h3{margin:26px 0 9px;font-size:17px;line-height:1.2;letter-spacing:-.02em}.md p{margin:10px 0}.md ul,.md ol{padding-left:23px;margin:10px 0}.md li{margin:5px 0}.md code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 5px;border-radius:5px;background:var(--surface2);overflow-wrap:anywhere}.promptbox{position:relative;margin:16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}.promptbox pre{margin:0;padding:48px 17px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}.copy{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}.md table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}.md th,.md td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.md th{background:var(--surface)}.next{display:flex;justify-content:space-between;gap:1 -top:8px!important;max-height:min(58vh,420px);overflow-y:auto;overflow-x:hidden;padding:0 2px 4px!important}.rail.menu-open .nav{display:block!important}.nav a{max-width:none}.nav-start{display:block!important}.nav-group summary{padding:9px}.nav-lessons{padding-left:8px}.nav .nav-lesson{grid-template-columns:27px minmax(0,1fr);padding:8px 10px;font-size:12px}.nav-lesson-title{font-size:12px!important}}
.md a{overflow-wrap:anywhere}.hero-note{font-size:12px;line-height:1.45;color:var(--muted);margin:10px 0 0}</style></head><body><header class="bar"><a class="brand" href="#home">AI Animation Shorts</a><button class="theme" id="theme" aria-checked="false" aria-label="Switch theme">☀</button></header><div class="shell"><aside class="rail"><div class="rail-label">Course</div><button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-expanded="false" aria-controls="nav"><span>Course menu</span><b id="mobile-nav-current">Choose a section</b></button><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div><script id="course-data" type="application/json">{"title":"AI Animation Shorts","modules":[{"number":"01","id":"study","title":"Study animation shorts","promise":"See what makes a small animated story stay with you.","lessons":[1,2,3]},{"number":"02","id":"story","title":"Write one small story","promise":"Turn one feeling into a clear beginning, change and ending.","lessons":[4,5,6,7,8]},{"number":"03","id":"world","title":"Build a world people believe","promise":"Create one character, one place and a few visual rules.","lessons":[9,10,11,12]},{"number":"04","id":"plan","title":"Plan shots before generating","promise":"Make every image and clip serve a specific story beat.","lessons":[13,14,15]},{"number":"05","id":"stills","title":"Make your key animation stills","promise":"Generate original characters, places and moments that match.","lessons":[16,17,18,19]},{"number":"06","id":"motion","title":"Animate with purpose","promise":"Create movement that reveals change instead of random motion.","lessons":[20,21,22,23]},{"number":"07","id":"sound","title":"Use sound and pace","promise":"Give the short rhythm, silence and emotional shape.","lessons":[24,25,26]},{"number":"08","id":"finish","title":"Finish your first short","promise":"Assemble, review and export a simple original animation.","lessons":[27,28,29]},{"number":"09","id":"repeat","title":"Make the next one stronger","promise":"Learn from the first short and build a repeatable process.","lessons":[30]}],"lessons":[{"id":"lesson-01","number":1,"module":"study","title":"Study award-winning shorts without copying","kind":"Story","status":"research","visual":null,"body":"## Study, do not copy\n\nAward-winning shorts are useful because they show how much a clear emotional idea can do in a few minutes. We study transferable choices such as a single point of view, a visible obstacle, a meaningful turn and a final image that completes the feeling. Do not copy a film\u2019s plot, dialogue, character, visual style or exact shots.\n\n## Award study links\n\n- [Academy Awards, 2025 Animated Short Film winner](https://www.oscars.org/oscars/ceremonies/2025)\n- [Academy Awards, 2024 Animated Short Film winner](https://www.oscars.org/oscars/ceremonies/2024)\n- [BAFTA British Short Animation winners](https://bafta.org/awards/film/british-short-animation)\n- [Annecy 2025 award results](https://www.annecyfestival.com/en/le-festival/2025-awards)\n\n## Do this\n\n1. Watch three short animations you legally have access to.\n2. For each one, write one sentence for: who we follow, what they want, what gets in the way, what changes and what the last image makes you feel.\n3. Do not save frames, copy dialogue or recreate the film. Save only your own plain-language observations.\n\n## Check your result\n\nYou can explain the emotional movement of each short without describing its whole plot.\n\n## Save\n\nSave as `01-award-short-observations.md`.\n"},{"id":"lesson-02","number":2,"module":"study","title":"Find the one feeling your short will carry","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nChoose one feeling that the viewer should carry away from your short.\n\n## Why this matters\n\nA small film becomes clearer when it is built around one emotional destination instead of many unrelated ideas.\n\n## Before you start\n\nA blank note and ten quiet minutes.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write three feelings you know personally, such as relief, jealousy, homesickness or courage.\n2. Choose one feeling that could be shown through an action, not explained in dialogue.\n3. Write: \u201cAt the end, I want the viewer to feel ____.\u201d\n4. Keep that sentence at the top of every planning page.\n\n## Check your result\n\nYour feeling is specific enough that two people would imagine different actions for it.\n\n## If it goes wrong\n\nIf you chose a broad word like \u201clove\u201d, narrow it to a moment, such as \u201cthe relief of being forgiven.\u201d\n\n## Save\n\nSave as `02-final-feeling.md`.\n\n## Next\n\nNow give one character a simple want that can carry that feeling.\n"},{"id":"lesson-03","number":3,"module":"study","title":"Give one character one clear want","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nCreate a main character with a visible want.\n\n## Why this matters\n\nThe viewer can follow a short film quickly when they know what one person, creature or object is trying to do.\n\n## Before you start\n\nYour final-feeling sentence.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Choose a character you can describe in one ordinary line.\n2. Give them one small visible want they can try to achieve on screen.\n3. Write one reason the want matters today.\n4. Remove every second goal.\n\n## Check your result\n\nYou can complete: \u201cWe follow ___ who wants ___ before ___.\u201d\n\n## If it goes wrong\n\nIf the character wants an abstract idea, turn it into an action they can attempt.\n\n## Save\n\nSave as `03-character-want.md`.\n\n## Next\n\nBuild the obstacle that makes the attempt interesting.\n"},{"id":"lesson-04","number":4,"module":"story","title":"Write a one-sentence premise","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nTurn your character and want into a simple original premise.\n\n## Why this matters\n\nA premise prevents beautiful AI images from becoming disconnected clips.\n\n## Before you start\n\nYour character and one clear want.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Use this shape: \u201cA ___ wants ___, but ___.\u201d\n2. Write five versions.\n3. Choose the version with a physical obstacle or choice.\n4. Keep it under 25 words.\n\n## Copy this prompt\n\n```text\nHelp me write five original animated-short premises. Each uses one character, one visible want and one clear obstacle. Keep every premise under 25 words. Do not imitate existing films, studios, artists or characters.\n```\n\n## Check your result\n\nYour sentence contains a character, want and obstacle.\n\n## If it goes wrong\n\nIf it sounds like a feature film, make the want smaller and limit the world to one place or one day.\n\n## Save\n\nSave as `04-one-sentence-premise.md`.\n\n## Next\n\nDecide what makes the obstacle hard now.\n"},{"id":"lesson-05","number":5,"module":"story","title":"Make the obstacle personal","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nChoose an obstacle that changes how your character feels or acts.\n\n## Why this matters\n\nA random problem creates activity. A personal problem creates a story.\n\n## Before you start\n\nYour selected premise.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Ask what the character might lose if they fail.\n2. Choose one obstacle that cannot be solved immediately.\n3. Make the obstacle visible in the world or another character.\n4. Write the one choice the character will have to make.\n\n## Check your result\n\nThe obstacle forces a choice, not just more movement.\n\n## If it goes wrong\n\nIf the problem can be fixed with one easy action, add a cost, a deadline or a trade-off.\n\n## Save\n\nSave as `05-obstacle-and-choice.md`.\n\n## Next\n\nUse that choice to create a turn.\n"},{"id":"lesson-06","number":6,"module":"story","title":"Plan the story turn","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nWrite the moment when the short changes direction.\n\n## Why this matters\n\nThe turn gives a short film a reason to keep moving after the setup.\n\n## Before you start\n\nYour premise and obstacle.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write what the viewer expects to happen.\n2. Write one believable event that changes that expectation.\n3. Make the event come from the character\u2019s action or the world rule.\n4. Write the new choice it creates.\n\n## Copy this prompt\n\n```text\nGive me three original story-turn options for this premise: [PASTE PREMISE]. Each turn must come from the character\u2019s action or a stated world rule. Do not add a random rescue.\n```\n\n## Check your result\n\nThe turn changes the character\u2019s plan and makes the ending possible.\n\n## If it goes wrong\n\nIf the turn feels like a surprise for its own sake, connect it to a clue placed in the beginning.\n\n## Save\n\nSave as `06-story-turn.md`.\n\n## Next\n\nChoose a final image that closes the feeling.\n"},{"id":"lesson-07","number":7,"module":"story","title":"Choose the final image","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nPlan a last image that leaves the viewer with the intended feeling.\n\n## Why this matters\n\nIn a short animation, the final image can carry more meaning than another explanation.\n\n## Before you start\n\nYour final feeling and story turn.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write the character\u2019s state at the beginning.\n2. Write how they are different at the end.\n3. Choose one simple image that shows this difference.\n4. Avoid text that explains the lesson.\n\n## Check your result\n\nA viewer could understand the emotional change from the first and final images alone.\n\n## If it goes wrong\n\nIf your ending needs a speech, look for an action, object or empty space that can show it.\n\n## Save\n\nSave as `07-final-image.md`.\n\n## Next\n\nTurn the whole idea into eight small beats.\n"},{"id":"lesson-08","number":8,"module":"story","title":"Make an eight-beat short map","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nCreate a compact map for the whole short.\n\n## Why this matters\n\nEight beats are enough to guide a one to three minute animation without overplanning it.\n\n## Before you start\n\nYour premise, obstacle, turn and final image.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write: ordinary moment, want, first try, obstacle, second try, turn, choice, final image.\n2. Use one short sentence per beat.\n3. Remove beats that repeat the same emotion.\n4. Read it aloud in under one minute.\n\n## Copy this prompt\n\n```text\nTurn this original premise into an eight-beat animated short map: [PASTE PREMISE]. Use: ordinary moment, want, first try, obstacle, second try, turn, choice, final image. Keep every beat visual and concise. Do not imitate existing films.\n```\n\n## Check your result\n\nEvery beat changes the situation or reveals something new.\n\n## If it goes wrong\n\nIf two beats do the same job, merge them.\n\n## Save\n\nSave as `08-eight-beat-map.md`.\n\n## Next\n\nNow create the character and world rules that make the images consistent.\n"},{"id":"lesson-09","number":9,"module":"world","title":"Create a character identity sheet","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nDescribe one original character clearly enough to recreate them across shots.\n\n## Why this matters\n\nConsistency starts with decisions before prompts. AI cannot protect details you never define.\n\n## Before you start\n\nYour eight-beat map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose age range, silhouette, posture, clothing and one meaningful object.\n2. Write what they do when nervous or hopeful.\n3. Choose two colours that support the feeling.\n4. Write what must never change.\n\n## Copy this prompt\n\n```text\nCreate an original animation character identity sheet in plain language. Character role: [ROLE]. Feeling of the short: [FEELING]. Include silhouette, posture, wardrobe, one meaningful object, two key colours, expression range and non-negotiable continuity details. Do not imitate any existing character, studio or artist.\n```\n\n## Check your result\n\nYou have five to eight details that another person could recognise in every shot.\n\n## If it goes wrong\n\nIf the sheet is only adjectives, add visible decisions such as a worn coat, a square backpack or a careful walk.\n\n## Save\n\nSave as `09-character-identity.md`.\n\n## Next\n\nGive the character one focused place to live in.\n"},{"id":"lesson-10","number":10,"module":"world","title":"Build one story location","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nDesign one location that supports the character\u2019s problem.\n\n## Why this matters\n\nA short is easier to make when it uses one memorable place instead of many loosely connected backgrounds.\n\n## Before you start\n\nCharacter identity sheet.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose the place where most of the short happens.\n2. List three useful objects and one limitation of the space.\n3. Choose time of day and weather only if they affect the story.\n4. Write what the location looks like before and after the change.\n\n## Copy this prompt\n\n```text\nDesign one original animated-short location for this premise: [PASTE PREMISE]. Include a clear layout, three story-useful objects, one visual limitation, lighting mood and details that can stay consistent across multiple shots. Do not imitate a named film, artist or studio.\n```\n\n## Check your result\n\nThe location gives the character useful things to do and a clear place to be.\n\n## If it goes wrong\n\nIf the location is only decorative, add an object or route that creates the obstacle.\n\n## Save\n\nSave as `10-location-rules.md`.\n\n## Next\n\nSet the visual rules that connect character and place.\n"},{"id":"lesson-11","number":11,"module":"world","title":"Choose your visual rules","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a small visual rule set for your original short.\n\n## Why this matters\n\nA consistent visual language makes separate generations feel like one film.\n\n## Before you start\n\nCharacter and location sheets.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose one material feeling, such as paper, painted clay, ink or clean graphic shapes.\n2. Choose one line or edge rule.\n3. Choose a simple light rule.\n4. Choose what images must avoid.\n\n## Copy this prompt\n\n```text\nCreate a compact visual rule set for an original animated short. Emotion: [FEELING]. Character: [CHARACTER]. Location: [LOCATION]. Include material feeling, shape language, light rule, colour limits, texture limits and a short avoid list. Do not copy a named artist, studio, film or animation style.\n```\n\n## Check your result\n\nYour rule set could help reject an image that is beautiful but belongs to another film.\n\n## If it goes wrong\n\nIf it lists too many style words, keep one material, one line rule, one light rule and two colours.\n\n## Save\n\nSave as `11-visual-rules.md`.\n\n## Next\n\nTurn the rules into a small reference board.\n"},{"id":"lesson-12","number":12,"module":"world","title":"Make a four-image reference board","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nPlan four reference images that lock your short\u2019s identity.\n\n## Why this matters\n\nA small deliberate board is more useful than a folder full of unrelated beautiful images.\n\n## Before you start\n\nYour visual rules.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Plan one character full-body view, one character close view, one wide location and one key object.\n2. Write the same visual rules into each prompt.\n3. Generate a few versions of each.\n4. Keep only images that belong together.\n\n## Copy this prompt\n\n```text\nCreate an original animated-film reference image. Subject: [CHARACTER OR LOCATION]. Keep these fixed: [PASTE VISUAL RULES]. Clear readable silhouette, story-focused composition, no text, no logos, no watermark, no existing franchise, no imitation of a named artist or studio.\n```\n\n## Check your result\n\nAll four images feel like the same world before you put them beside each other.\n\n## If it goes wrong\n\nIf one image feels like another genre, regenerate it from the exact same rule set rather than editing its style alone.\n\n## Save\n\nSave as `12-reference-board.md`.\n\n## Next\n\nUse the board to plan shots, not random scenes.\n"},{"id":"lesson-13","number":13,"module":"plan","title":"Turn beats into storyboard frames","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nChoose one frame for every important story beat.\n\n## Why this matters\n\nA storyboard helps you see whether the film can be understood before you animate anything.\n\n## Before you start\n\nEight-beat map and reference board.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Make one rough frame per beat.\n2. Label what changes in that frame.\n3. Keep the character\u2019s position and screen direction readable.\n4. Add only the visual information needed for the beat.\n\n## Copy this prompt\n\n```text\nTurn this eight-beat map into a simple original animated-short storyboard plan. For every beat, state: frame type, what the viewer notices first, character action, emotion and what changes by the end of the shot. Keep it simple and visual. [PASTE EIGHT BEATS]\n```\n\n## Check your result\n\nA friend can understand the basic story by looking at the eight frames in order.\n\n## If it goes wrong\n\nIf a frame contains two story changes, split it into two shots.\n\n## Save\n\nSave as `13-storyboard-plan.md`.\n\n## Next\n\nMake a shot list with one purpose per shot.\n"},{"id":"lesson-14","number":14,"module":"plan","title":"Write a purpose-first shot and motion list","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nGive every shot one clear storytelling job and choose only the movement it needs.\n\n## Why this matters\n\nAI animation becomes expensive and messy when shots exist only because they look cool. Stillness is useful when it protects attention and tension.\n\n## Before you start\n\nStoryboard plan.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. For every frame, write the shot number and its one job.\n2. Choose whether the viewer needs place, action, reaction, discovery or change.\n3. Mark each shot as still, small character action, camera move or transition.\n4. Use movement only when it reveals action, reaction or a new fact.\n5. Avoid moves that reveal unseen space unless you have designed it.\n\n## Check your result\n\nYou can say why every shot exists and why every planned movement tells the viewer something new.\n\n## If it goes wrong\n\nIf a shot has two jobs, make two shorter shots. If everything moves, choose three moments where stillness makes the change stronger.\n\n## Save\n\nSave as `14-purpose-shot-and-motion-list.md`.\n\n## Next\n\nPrepare the references each AI shot will need.\n"},{"id":"lesson-15","number":15,"module":"plan","title":"Package shot references","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nPrepare clean references before generating a shot.\n\n## Why this matters\n\nA shot is more consistent when you tell the generator what must stay fixed.\n\n## Before you start\n\nReference board, shot list and motion plan.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. For each shot, list its character reference, location reference and key object reference.\n2. Write the beat, emotion and exact action.\n3. State what must not change.\n4. Keep one line for the desired frame shape.\n\n## Check your result\n\nEvery future shot has a small source list and a clear purpose.\n\n## If it goes wrong\n\nIf a shot needs five unrelated inputs, simplify the shot or make a missing reference first.\n\n## Save\n\nSave as `15-shot-reference-map.md`.\n\n## Next\n\nGenerate the still images that form the spine of the short.\n"},{"id":"lesson-16","number":16,"module":"stills","title":"Generate your establishing image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a first image that tells the viewer where they are and what matters.\n\n## Why this matters\n\nThe first frame gives the viewer a world, a character position and an emotional promise.\n\n## Before you start\n\nLocation rules, character sheet and Shot 01 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Attach the chosen character and location references.\n2. Paste the prompt with the exact story beat.\n3. Generate three to four versions.\n4. Keep the one with the clearest story information.\n\n## Copy this prompt\n\n```text\nOriginal animated short, establishing frame. Character: [CHARACTER]. Location: [LOCATION]. Story beat: [BEAT]. Keep character identity, location layout and visual rules fixed: [RULES]. The viewer should notice [STORY FOCUS] first. Clear silhouette, readable composition, no text, no logos, no watermark, no imitation of a named film, artist or studio.\n```\n\n## Check your result\n\nA viewer can tell where they are, who they should watch and the initial emotional tone.\n\n## If it goes wrong\n\nIf the image only looks decorative, state what the viewer must notice first and simplify the background.\n\n## Save\n\nSave as `16-shot-01-establishing.png`.\n\n## Next\n\nGenerate the action image that begins the attempt.\n"},{"id":"lesson-17","number":17,"module":"stills","title":"Generate the first action image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a still where the character actively tries to get what they want.\n\n## Why this matters\n\nThe story begins moving when the character does something visible.\n\n## Before you start\n\nShot 02 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Attach the same character and location references.\n2. State the exact action and emotional effort.\n3. Keep the action readable in one frame.\n4. Generate versions without changing the core visual rules.\n\n## Copy this prompt\n\n```text\nOriginal animated short, action frame. Same [CHARACTER] in the same [LOCATION]. The character is [EXACT ACTION] because they want [WANT]. Preserve [FIXED DETAILS]. Visual rules: [RULES]. Make the action readable at first glance. No text, logos, watermark or imitation of named work.\n```\n\n## Check your result\n\nYou can point to the character\u2019s action and explain the want without extra dialogue.\n\n## If it goes wrong\n\nIf the pose is vague, reduce the action to one hand, one object and one direction of movement.\n\n## Save\n\nSave as `17-shot-02-action.png`.\n\n## Next\n\nCreate the obstacle image that changes the plan.\n"},{"id":"lesson-18","number":18,"module":"stills","title":"Generate the obstacle image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate a frame that makes the problem visible.\n\n## Why this matters\n\nThe viewer should not have to guess why the character cannot simply continue.\n\n## Before you start\n\nObstacle beat and Shot 03 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. State the obstacle before style details.\n2. Keep character and location anchors fixed.\n3. Show the character noticing or meeting the obstacle.\n4. Generate several versions and reject any that rewrite the world.\n\n## Copy this prompt\n\n```text\nOriginal animated short, obstacle frame. Same [CHARACTER] and [LOCATION]. The visible obstacle is [OBSTACLE]. Show the character\u2019s immediate reaction. Preserve [FIXED DETAILS]. Visual rules: [RULES]. The obstacle must be legible, specific and story-relevant. No text, logos or imitation of named work.\n```\n\n## Check your result\n\nThe viewer knows what changed and why the first plan cannot work.\n\n## If it goes wrong\n\nIf the generator invents a new location or extra characters, shorten the prompt and attach only the exact references for this shot.\n\n## Save\n\nSave as `18-shot-03-obstacle.png`.\n\n## Next\n\nCreate the turn image, where the story becomes different.\n"},{"id":"lesson-19","number":19,"module":"stills","title":"Generate the turn image","kind":"AI image","status":"research","visual":null,"body":"## What you can do\n\nCreate the visual moment that changes the character\u2019s plan.\n\n## Why this matters\n\nA strong turn gives the ending a direction instead of making it feel sudden.\n\n## Before you start\n\nStory turn and Shot 04 reference map.\n\n## Use this platform\n\nYour current image generation route\n\n## Use this route\n\nCurrent image route with image references\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. State the turn in one concrete action or discovery.\n2. Keep all earlier continuity anchors.\n3. Show the character looking, choosing or acting differently.\n4. Reject images that add an unrelated surprise.\n\n## Copy this prompt\n\n```text\nOriginal animated short, turning-point frame. Same [CHARACTER] in [LOCATION]. The story changes when [TURN]. Show a readable new choice or discovery. Preserve [FIXED DETAILS]. Visual rules: [RULES]. No text, logos, watermark or imitation of named work.\n```\n\n## Check your result\n\nThe viewer can see why the character will now act differently.\n\n## If it goes wrong\n\nIf the turn feels random, add one earlier object or rule that makes it feel earned.\n\n## Save\n\nSave as `19-shot-04-turn.png`.\n\n## Next\n\nCreate the final image that completes the emotion.\n"},{"id":"lesson-20","number":20,"module":"motion","title":"Animate one small action","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nTurn one approved still into a short action clip.\n\n## Why this matters\n\nSmall controlled movement is easier to judge and more useful than a dramatic move that breaks continuity.\n\n## Before you start\n\nA final approved still and one sentence describing the action.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Use the still as the start image.\n2. Ask for one action only.\n3. Keep duration short.\n4. Generate multiple versions and watch the entire clip.\n\n## Copy this prompt\n\n```text\nAnimate this original frame. Keep the character, location, design, proportions and lighting fixed. The only action is: [ONE SMALL ACTION]. Movement begins gently, remains physically believable and ends in a clear held pose. No new objects, no camera teleport, no morphing, no text or logo.\n```\n\n## Check your result\n\nThe character, scene and important object remain recognisable from first frame to last.\n\n## If it goes wrong\n\nIf the clip adds new objects or changes the face, reduce the motion and repeat from the original still.\n\n## Save\n\nSave as `20-shot-animated.mp4`.\n\n## Next\n\nUse a reaction clip to show how the change feels.\n"},{"id":"lesson-21","number":21,"module":"motion","title":"Animate a reaction instead of explaining","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nCreate a short reaction clip that lets the viewer feel the story turn.\n\n## Why this matters\n\nA reaction can replace dialogue and make an animated short more universal.\n\n## Before you start\n\nA turn still with a clear character face or body pose.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose one emotion shift, such as worry to relief.\n2. Keep the character mostly in place.\n3. Ask for eye, head, breath or hand movement only.\n4. Review frame by frame for identity drift.\n\n## Copy this prompt\n\n```text\nAnimate this original reaction frame. Preserve identity, costume, proportions, environment and composition. The character moves from [START EMOTION] to [END EMOTION] through a subtle change in eyes, breath, head and hands. Keep camera stable. No new objects, no morphing, no text.\n```\n\n## Check your result\n\nYou can understand the emotional change with the sound muted.\n\n## If it goes wrong\n\nIf the expression becomes exaggerated or changes identity, ask for smaller movement and a stable camera.\n\n## Save\n\nSave as `21-reaction-clip.mp4`.\n\n## Next\n\nMake one transition that carries the viewer to the next beat.\n"},{"id":"lesson-22","number":22,"module":"motion","title":"Build a story transition","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nConnect two story beats with a motivated transition.\n\n## Why this matters\n\nA transition should move the story forward, not hide a broken cut.\n\n## Before you start\n\nThe final frame of one beat and the first frame of the next.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Write what changes between the two moments.\n2. Choose a shared object, movement or direction to connect them.\n3. Use a short clip or simple cut.\n4. Reject transitions that invent a new scene.\n\n## Copy this prompt\n\n```text\nCreate a short original transition from this first frame to this end frame. Preserve character identity and world rules. The transition is motivated by [SHARED ACTION OR OBJECT]. Move smoothly and simply toward the next story beat. Do not introduce new characters, locations, text, logos or unrelated events.\n```\n\n## Check your result\n\nThe viewer understands that time or situation has moved forward.\n\n## If it goes wrong\n\nIf the transition invents too much, use a clean cut between two approved stills or clips instead.\n\n## Save\n\nSave as `22-story-transition.mp4`.\n\n## Next\n\nAnimate the final held moment with restraint.\n"},{"id":"lesson-23","number":23,"module":"motion","title":"Protect the final image","kind":"AI video","status":"research","visual":null,"body":"## What you can do\n\nCreate a final clip that lands on the emotional ending instead of distracting from it.\n\n## Why this matters\n\nThe viewer needs a moment to receive the ending.\n\n## Before you start\n\nYour planned final image.\n\n## Use this platform\n\nYour current image-to-video route\n\n## Use this route\n\nCurrent image-to-video route with a start image\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** Use the current available route in your own account. Do not call it tested until you have run and reviewed it.\n\n## Do this\n\n1. Choose one tiny environmental or character movement.\n2. Hold the final pose long enough to feel it.\n3. Avoid a new plot event.\n4. Watch with sound off before adding audio.\n\n## Copy this prompt\n\n```text\nAnimate this original final image with restraint. Preserve composition, character identity, world rules and final emotional meaning. Use only [TINY MOVEMENT]. End on a stable held image. No new action, no camera move that reveals unseen space, no text or logo.\n```\n\n## Check your result\n\nThe clip leaves space for the final feeling instead of starting a new scene.\n\n## If it goes wrong\n\nIf the generator keeps adding action, use the still image as the final shot.\n\n## Save\n\nSave as `23-final-moment.mp4`.\n\n## Next\n\nNow add sound only where it strengthens the emotional beat.\n"},{"id":"lesson-24","number":24,"module":"sound","title":"Choose a sound plan","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nPlan simple sound that supports the short\u2019s emotional movement.\n\n## Why this matters\n\nSound can tell the viewer where to listen and when a change matters.\n\n## Before you start\n\nYour eight-beat map and current clips.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. For each beat, write silence, environment, action sound or music shift.\n2. Choose one sound motif linked to the character or want.\n3. Leave at least two moments quiet.\n4. Do not add sound just to fill empty space.\n\n## Copy this prompt\n\n```text\nCreate a simple original sound plan for this eight-beat animated short. For each beat, choose silence, environment, action sound or a music shift. Use one repeated sound motif and preserve quiet moments. Do not reference or imitate existing soundtrack music. [PASTE EIGHT BEATS]\n```\n\n## Check your result\n\nEvery sound choice has a story or feeling reason.\n\n## If it goes wrong\n\nIf every line says music, remove music from two beats and let action or silence carry them.\n\n## Save\n\nSave as `24-sound-plan.md`.\n\n## Next\n\nPlace clips in the simplest order that tells the story.\n"},{"id":"lesson-25","number":25,"module":"sound","title":"Build a rough vertical edit","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nPlace your approved frames and clips in story order.\n\n## Why this matters\n\nA rough cut reveals story gaps faster than generating more material.\n\n## Before you start\n\nAll approved frames and clips, named in shot order.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Place material in eight-beat order.\n2. Use simple cuts first.\n3. Hold each shot long enough to read.\n4. Watch once with no sound and write where you get lost.\n\n## Check your result\n\nA viewer can describe the basic story after one watch.\n\n## If it goes wrong\n\nIf the story is unclear, fix the missing beat or shot purpose before adding effects.\n\n## Save\n\nSave as `25-rough-cut.mp4`.\n\n## Next\n\nUse pace to make the turn and ending land.\n"},{"id":"lesson-26","number":26,"module":"sound","title":"Pace the turn and ending","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nAdjust shot length so the viewer feels the change.\n\n## Why this matters\n\nPace is not about making everything fast. It is about giving key moments enough time.\n\n## Before you start\n\nYour rough cut and story turn.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Watch where the viewer first understands the obstacle.\n2. Give the turn a little space before and after it.\n3. Hold the final image longer than an ordinary action.\n4. Remove repeated shots that do not change the story.\n\n## Check your result\n\nThe turn is clear and the final moment has room to land.\n\n## If it goes wrong\n\nIf you solve pacing only by speeding everything up, remove duplicate information instead.\n\n## Save\n\nSave as `26-paced-rough-cut.mp4`.\n\n## Next\n\nCheck the short like a first-time viewer.\n"},{"id":"lesson-27","number":27,"module":"finish","title":"Run a first-viewer story check","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nFind story problems before final export.\n\n## Why this matters\n\nYou know the idea already. A first viewer shows where the film is only clear inside your head.\n\n## Before you start\n\nYour paced rough cut and one trusted viewer.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Ask them what they think the character wanted.\n2. Ask what changed and how they felt at the end.\n3. Do not explain while they watch.\n4. Write only the points where they were confused.\n\n## Check your result\n\nTheir answers match your premise, turn and final feeling closely enough.\n\n## If it goes wrong\n\nIf they miss the want or turn, add or remake the shot that should make it visible.\n\n## Save\n\nSave as `27-first-viewer-notes.md`.\n\n## Next\n\nRun an identity and continuity check.\n"},{"id":"lesson-28","number":28,"module":"finish","title":"Run a continuity check","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nCatch visual changes that pull the viewer out of the story.\n\n## Why this matters\n\nA small identity change can make an AI animation feel accidental, even when the story is good.\n\n## Before you start\n\nFinal candidate clips in order.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Check face, clothing, props, scale, location layout and light direction across every cut.\n2. Mark only visible continuity breaks.\n3. Regenerate the smallest broken shot from the original references.\n4. Do not recolour the whole film to hide a single failure.\n\n## Check your result\n\nThe character and world remain recognisable through the full sequence.\n\n## If it goes wrong\n\nIf too many shots drift, return to your reference board and rebuild the one core character or location image first.\n\n## Save\n\nSave as `28-continuity-notes.md`.\n\n## Next\n\nFinish one clean version for sharing.\n"},{"id":"lesson-29","number":29,"module":"finish","title":"Export your first original short","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nCreate one clear final version and a short description of what it is.\n\n## Why this matters\n\nFinishing a small original film teaches more than endlessly improving a collection of clips.\n\n## Before you start\n\nA story-checked, continuity-checked final cut.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Export the version at the platform\u2019s normal high-quality setting.\n2. Write the title, one-sentence premise and a disclosure that it is AI-assisted.\n3. Keep the source prompts and references private unless you want to share them.\n4. Save one final file and stop changing it for a day.\n\n## Check your result\n\nYou have one finished file, a title and one original premise sentence.\n\n## If it goes wrong\n\nIf you keep changing small details, make a list for version two rather than reopening version one.\n\n## Save\n\nSave as `29-final-original-short.mp4`.\n\n## Next\n\nReview what worked, then make the next short smaller and stronger.\n"},{"id":"lesson-30","number":30,"module":"repeat","title":"Make a better second short","kind":"Story","status":"research","visual":null,"body":"## What you can do\n\nUse your first finished short to choose a sharper next exercise.\n\n## Why this matters\n\nThe fastest growth comes from repeating the whole story-to-screen loop with a smaller, clearer challenge.\n\n## Before you start\n\nYour first-viewer notes and continuity notes.\n\n## Use this platform\n\nStory notebook\n\n## Use this route\n\nNo model needed\n\n**Status: RESEARCHED \u00b7 NOT YET TESTED.** This lesson teaches a decision before generation.\n\n## Do this\n\n1. Write three things that worked.\n2. Choose one storytelling problem and one AI workflow problem to improve.\n3. Write a new one-sentence premise with one stronger constraint.\n4. Limit the next short to six beats.\n\n## Copy this prompt\n\n```text\nHelp me create three original six-beat animated-short premises. I want to improve [STORY PROBLEM] and [WORKFLOW PROBLEM] from my last project. Each premise needs one character, one clear want, one visible obstacle, one turn and a final image. Do not imitate any existing film, character, studio or artist.\n```\n\n## Check your result\n\nYour next short is smaller in scope but clearer in story challenge.\n\n## If it goes wrong\n\nIf the new idea is bigger than the first, reduce it to one character, one location and one emotional change.\n\n## Save\n\nSave as `30-next-short-brief.md`.\n\n## Next\n\nStart again at the award study, then make something that is unmistakably yours.\n"}]}</script><script>
const DATA=JSON.parse(document.querySelector('#course-data').textContent),lessons=DATA.lessons,byId=Object.fromEntries(lessons.map(x=>[x.id,x])),byNum=Object.fromEntries(lessons.map(x=>[x.number,x])),app=document.querySelector('#app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(src){let out=[],list=null,inCode=false,code=[];function close(){if(list){out.push('</'+list+'>');list=null}}function flushCode(){if(code.length){let raw=code.join('\n');out.push('<div class="promptbox"><button class="copy" data-copy="'+encodeURIComponent(raw)+'">Copy prompt</button><pre>'+esc(raw)+'</pre></div>');code=[]}}for(const raw of src.split('\n')){let l=raw.trim();if(l.startsWith('```')){if(inCode){inCode=false;flushCode()}else{close();inCode=true;code=[]}continue}if(inCode){code.push(raw);continue}if(!l){close();continue}if(/^##\s+/.test(l)){close();out.push('<h2>'+inline(l.slice(3))+'</h2>');continue}if(/^>\s+/.test(l)){close();out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');continue}if(/^\d+\.\s+/.test(l)){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>');continue}if(l.startsWith('- ')){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(l.slice(2))+'</li>');continue}close();out.push('<p>'+inline(l)+'</p>')}close();if(inCode)flushCode();return out.join('')}
function nav(){let el=document.querySelector('#nav');el.innerHTML='<a class="nav-start" href="#tools"><b>START</b><span>Tools first</span></a>'+DATA.modules.map(m=>'<details class="nav-group" data-module="'+m.id+'"><summary><span class="nav-module-copy"><b>'+m.number+' · '+esc(m.title)+'</b><span>'+m.lessons.length+' lesson'+(m.lessons.length===1?'':'s')+'</span></span></summary><div class="nav-lessons"><a class="nav-overview" href="#module/'+m.id+'">Module overview</a>'+m.lessons.map(n=>{let l=byNum[n];return '<a class="nav-lesson" data-lesson="'+l.id+'" href="#lesson/'+l.id+'"><span class="nav-lesson-no">'+String(l.number).padStart(2,'0')+'</span><span class="nav-lesson-title">'+esc(l.title)+'</span></a>'}).join('')+'</div></details>').join('');el.querySelectorAll('.nav-group').forEach(d=>d.querySelector('summary').addEventListener('click',()=>{if(!d.open)el.querySelectorAll('.nav-group').forEach(other=>{if(other!==d)other.open=false})}));let rail=document.querySelector('.rail'),toggle=document.querySelector('#mobile-nav-toggle');toggle.onclick=()=>{let open=rail.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',open)};el.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=850){rail.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false')}})}
function syncNav(h){let el=document.querySelector('#nav'),rail=document.querySelector('.rail'),current=document.querySelector('#mobile-nav-current'),active=[...el.querySelectorAll('a')].find(a=>a.getAttribute('href')==='#'+h),groupId=null,label='Choose a section';el.querySelectorAll('a').forEach(a=>{a.classList.remove('active');a.removeAttribute('aria-current')});el.querySelectorAll('.nav-group summary').forEach(s=>s.classList.remove('current'));if(h==='home')label='Course home';else if(h==='tools')label='Start · Tools';else if(h==='curriculum')label='All lessons';else if(h.startsWith('module/')){groupId=h.split('/')[1];let m=DATA.modules.find(x=>x.id===groupId);if(m)label=m.number+' · '+m.title}else if(h.startsWith('lesson/')){let l=byId[h.split('/')[1]];if(l){groupId=l.module;label=String(l.number).padStart(2,'0')+' · '+l.title}}if(active){active.classList.add('active');active.setAttribute('aria-current','page')}el.querySelectorAll('.nav-group').forEach(d=>{d.open=groupId?d.dataset.module===groupId:false;if(d.dataset.module===groupId)d.querySelector('summary').classList.add('current')});current.textContent=label;if(innerWidth>850&&active)setTimeout(()=>{let ar=active.getBoundingClientRect(),rr=rail.getBoundingClientRect();if(ar.top<rr.top+12||ar.bottom>rr.bottom-12)rail.scrollTop+=ar.top-rr.top-rr.height/3},0)}
function doneSet(){return new Set(JSON.parse(localStorage.getItem('ai-animation-done-v1')||'[]'))}function pct(){return Math.round(doneSet().size/30*100)}
function home(){app.innerHTML='<div class="wrap hero"><div class="eyebrow">AI ANIMATION SHORTS</div><h1>Make an original animated short people can feel.</h1><p>Start with one emotional idea. Build a character and world. Plan images as story beats. Animate only the movement that matters. Finish a small, original film.</p><div class="actions"><a class="button primary" href="#tools">Choose your tools</a><a class="button" href="#lesson/lesson-01">Start with Lesson 1</a></div><div class="proof"><figure><img src="assets/course-concept-hero.png" alt="Original animation-short course concept: a child holding a lantern in a rooftop garden at night"><figcaption>Original course concept image. A story seed, not a workflow result.</figcaption></figure><div class="stat"><strong>30</strong><b>story-first lessons for original AI animation</b><p>Write the feeling. Build the world. Plan the shot. Generate the frame. Animate the change. Finish the short.</p></div><div class="stat"><strong>1</strong><b>clear emotional movement</b><p>Strong shorts do not need a huge plot. They need a character, a want, an obstacle, a turn and a final image.</p></div></div><p class="hero-note">Original course concept image. It sets the mood for the course. It is not evidence for an AI workflow lesson.</p><section class="intro-band"><div class="eyebrow">The whole idea</div><h2>AI can help make the film. It cannot decide what your film means.</h2><p>You will learn the story decisions first, then use AI image and video routes to turn those decisions into consistent original shots.</p><div class="actions"><a class="button" href="#curriculum">See the full course</a></div></section></div>'}
function tools(){app.innerHTML='<div class="wrap"><div class="module-head"><div class="eyebrow">Before Lesson 1</div><h1>Choose a simple story and generation route.</h1><p>You do not need every tool. You need a writing space for the story lessons, one image route for character and shot stills, and an image-to-video route when you reach the animation lessons. Availability, controls and costs can change by account and region.</p></div><div class="tool-grid"><section class="tool-card"><h3>Story and planning</h3><p>Use any notes app, document or chat workspace where you can write your own premise, beats and shot purpose.</p></section><section class="tool-card"><h3>Image route</h3><p>Use a current route that can generate from a written prompt and accept image references when you need consistency.</p><a href="https://chatgpt.com/" target="_blank" rel="noreferrer">Open ChatGPT ↗</a></section><section class="tool-card"><h3>Image-to-video route</h3><p>Use a current generator that accepts a start image. Check current controls, cost and output before committing to a batch.</p><a href="https://referral.magnific.com/mzL3BCb" target="_blank" rel="noreferrer">Open Magnific ↗</a></section></div><section class="intro-band"><div class="eyebrow">Downloadable AI brains</div><h2>Give your AI a better job.</h2><p>Download one Markdown brain, paste it into a fresh AI conversation, then add your own idea underneath it. Start with the studio brain or choose one specialist role.</p><div class="tool-grid brain-grid"><section class="tool-card"><h3>Complete brain library</h3><p>All 11 specialist brains plus the README.</p><a href="assets/ai-animation-shorts-brain-library.zip" download>Download the ZIP ↗</a></section><section class="tool-card"><h3>Studio brain</h3><p>Choose the right story, planning or production mode.</p><a href="assets/brains/00-ai-animation-studio.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Award story analyst</h3><p>Study mechanisms from celebrated shorts without copying them.</p><a href="assets/brains/01-award-story-analyst.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Synopsis builder</h3><p>Turn a rough idea into a visual short synopsis.</p><a href="assets/brains/02-synopsis-builder.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Script builder</h3><p>Turn an approved synopsis into visible action.</p><a href="assets/brains/03-short-script-builder.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>30-second chunk planner</h3><p>Prepare clean story and generation-sized chunks.</p><a href="assets/brains/04-30-second-chunk-planner.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Continuity brain</h3><p>Lock character, world, style and allowed changes.</p><a href="assets/brains/05-character-world-continuity.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Storyboard planner</h3><p>Give every shot one clear storytelling job.</p><a href="assets/brains/06-storyboard-shot-planner.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Animation director</h3><p>Write precise, portable image-to-video shot prompts.</p><a href="assets/brains/07-ai-animation-director.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Sound and finish director</h3><p>Use sound and pacing to clarify the story.</p><a href="assets/brains/08-sound-and-finish-director.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Originality and QC</h3><p>Review story, continuity, motion and honest claims.</p><a href="assets/brains/09-originality-and-qc.md" download>Download Markdown ↗</a></section><section class="tool-card"><h3>Portfolio film review</h3><p>Prepare the finished short for public presentation.</p><a href="assets/brains/10-portfolio-film-review.md" download>Download Markdown ↗</a></section></div></section><div class="brain-sources"><div class="eyebrow">Research notes</div><p>Read the evidence behind the brains and the course methods.</p><p><a href="research/ai-film-workflow-research-2026-09-04.md">AI film workflow research ↗</a> &nbsp; <a href="research/academy-awards-research.md">Academy research ↗</a> &nbsp; <a href="research/annecy-award-research.md">Annecy research ↗</a> &nbsp; <a href="research/storytelling-research.md">Storytelling research ↗</a></p></div><section class="intro-band"><div class="eyebrow">Use this order</div><h2>Story first. Still images next. Motion last.</h2><p>Lessons 1 to 15 work before generation. Lessons 16 to 19 create the still spine. Lessons 20 to 23 add careful motion. The rest helps you use sound, pace and finish the short.</p></section></div>'}
function card(l){let first=l.body.split('\n').find(x=>x.startsWith('Turn ')||x.startsWith('Make ')||x.startsWith('Create ')||x.startsWith('Remove ')||x.startsWith('Show ')||x.startsWith('Use '))||'Open the practical workflow.';return '<a class="lesson-card" href="#lesson/'+l.id+'"><span class="lesson-no">LESSON '+String(l.number).padStart(2,'0')+'</span><h2>'+esc(l.title)+'</h2><p>'+esc(first)+'</p><span class="button">Open lesson →</span></a>'}
function curriculum(){app.innerHTML='<div class="wrap"><div class="module-head"><div class="eyebrow">30 lessons</div><h1>From one feeling to one finished original animated short.</h1><p>Every lesson gives you one clear decision or action. You will not generate disconnected clips. You will build a small story that holds together from first image to final moment.</p></div>'+DATA.modules.map(m=>'<section class="start-card"><div class="eyebrow">'+m.number+' · '+esc(m.title)+'</div><h2>'+esc(m.promise)+'</h2><div class="lesson-grid">'+m.lessons.map(n=>card(byNum[n])).join('')+'</div></section>').join('')+'</div>'}
function modulePage(id){let m=DATA.modules.find(x=>x.id===id);if(!m)return home();app.innerHTML='<div class="wrap"><div class="module-head"><a class="crumb" href="#curriculum">← Full curriculum</a><div class="eyebrow">Module '+m.number+'</div><h1>'+esc(m.title)+'</h1><p>'+esc(m.promise)+'</p></div><div class="lesson-grid">'+m.lessons.map(n=>card(byNum[n])).join('')+'</div></div>'}
function lesson(id){let l=byId[id];if(!l)return home();let i=lessons.indexOf(l),prev=lessons[i-1],next=lessons[i+1],done=doneSet(),v=l.visual,m=DATA.modules.find(x=>x.lessons.includes(l.number));app.innerHTML='<div class="wrap"><a class="crumb" href="#module/'+m.id+'">← '+esc(m.title)+'</a><div class="lesson-top"><span class="lesson-number">'+String(l.number).padStart(2,'0')+'</span><h1>'+esc(l.title)+'</h1></div><div class="lesson-meta"><span class="badge '+(l.status==='tested'?'tested':'research')+'">'+(l.status==='tested'?'TESTED · COURSE ROUTE':'RESEARCHED · NOT YET TESTED')+'</span><span class="badge">'+esc(l.kind)+'</span><span class="badge">'+esc(m.title)+'</span></div><div class="lesson-layout"><article class="reader">'+(v?'<div class="visual-pair"><figure class="visual"><img src="'+v.before+'" alt="Before example for '+esc(l.title)+'"><figcaption>Before / source</figcaption></figure><figure class="visual"><img src="'+v.after+'" alt="After example for '+esc(l.title)+'"><figcaption>After / verified course example</figcaption></figure></div><p class="visual-caption">'+esc(v.label)+(l.status==='tested'?' Tested course execution.':' Synthetic course demonstration.')+'</p>':'')+'<div class="md">'+md(l.body)+'</div><div class="next">'+(prev?'<a href="#lesson/'+prev.id+'">← '+esc(prev.title)+'</a>':'<span></span>')+(next?'<a href="#lesson/'+next.id+'">'+esc(next.title)+' →</a>':'<a href="#home">Finish →</a>')+'</div></article><aside class="side"><div class="side-card"><b>Where you are</b>Lesson '+l.number+' of 30<div class="progress"><i style="width:'+pct()+'%"></i></div>'+pct()+'% complete</div><div class="side-card"><b>Keep the story world true</b>Do not quietly change the character, costume, key prop, location layout or visual rules. Label staging, concepts and atmospheric changes honestly.</div><div class="side-card"><b>Your story pack</b>Keep your premise, beat map, identity sheets and approved shots together.</div><button class="button '+(done.has(l.id)?'primary':'')+'" id="complete">'+(done.has(l.id)?'Completed':'Mark complete and open next')+'</button></aside></div></div>';document.querySelector('#complete').onclick=()=>{done.add(l.id);localStorage.setItem('ai-animation-done-v1',JSON.stringify([...done]));let target=next?'#lesson/'+next.id:'#home';location.hash=target;route()}}
function route(){let h=location.hash.slice(1)||'home';syncNav(h);if(h==='home')home();else if(h==='tools')tools();else if(h==='curriculum')curriculum();else if(h.startsWith('module/'))modulePage(h.split('/')[1]);else if(h.startsWith('lesson/'))lesson(h.split('/')[1]);else home();scrollTo(0,0)}
function copyText(t){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(t).catch(()=>legacy(t));return Promise.resolve(legacy(t))}function legacy(t){let x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.append(x);x.select();document.execCommand('copy');x.remove()}document.addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(b){copyText(decodeURIComponent(b.dataset.copy));b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1400)}});let theme=document.querySelector('#theme');function setTheme(v){document.documentElement.dataset.theme=v;theme.setAttribute('aria-checked',v==='dark');theme.textContent=v==='dark'?'☾':'☀';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#000':'#fff';localStorage.setItem('ai-animation-theme-v1',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('ai-animation-theme-v1')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));nav();addEventListener('hashchange',route);route();
</script></body></html>
